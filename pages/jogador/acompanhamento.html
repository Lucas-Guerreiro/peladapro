<!-- pages/jogador/acompanhamento.html — Partida ao Vivo (Módulo Jogador Redesign) -->

<!-- ESTILOS EXCLUSIVOS DO PLACAR E CRONÔMETRO -->
<style>
  /* --- Cronômetro Moderno --- */
  .acomp-timer-wrapper-clear {
    align-items: center;
    text-align: center;
  }

  .acomp-timer-time-clear {
    font-size: 44px;
    font-weight: 300;
    font-family: monospace, sans-serif;
    color: #0F172A;
    letter-spacing: 2px;
    margin-bottom: 12px;
    line-height: 1;
  }

  .acomp-progress-container-clear {
    width: 100%;
    height: 8px;
    background: #F1F5F9;
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .acomp-progress-bar-clear {
    height: 100%;
    background: linear-gradient(90deg, #34D399 0%, #0284C7 100%);
    border-radius: 100px;
    transition: width 0.3s ease;
  }

  .acomp-status-badge-clear {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #64748B;
    font-weight: 600;
  }

  .acomp-pulse-dot-clear {
    width: 8px;
    height: 8px;
    background-color: #34D399; /* Verde menta */
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    animation: acomp-pulse-clear 2s infinite;
    display: inline-block;
  }

  .acomp-pulse-dot-clear.paused {
    background-color: #F87171;
    animation: none;
    box-shadow: none;
  }

  @keyframes acomp-pulse-clear {
    0% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    }
    70% {
      transform: scale(1);
      box-shadow: 0 0 0 8px rgba(52, 211, 153, 0);
    }
    100% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
    }
  }

  /* --- Scoreboard ao Vivo (Fundo Claro) --- */
  .acomp-score-card-clear {
    position: relative;
    padding: 32px 20px 24px;
    background: #FFFFFF;
  }

  .acomp-live-tag-clear {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #D1FAE5; /* Fundo verde menta suave */
    border: 1px solid #A7F3D0;
    color: #065F46;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 100px;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .acomp-live-tag-clear span {
    width: 6px;
    height: 6px;
    background-color: #34D399;
    border-radius: 50%;
    display: inline-block;
    animation: acomp-pulse-clear 1.5s infinite;
  }

  .acomp-scoreboard-row-clear {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    gap: 8px;
  }

  .acomp-team-box-clear {
    flex: 1.2;
    padding: 16px 10px;
    border-radius: 16px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #FFFFFF; /* Fundo branco unificado */
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .acomp-team-title-clear {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .acomp-players-list-clear {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .acomp-player-item-clear {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .acomp-player-avatar-clear {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
  }

  .acomp-player-name-clear {
    font-size: 12px;
    font-weight: 600;
    color: #1E293B;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 80px;
  }

  .acomp-score-display-clear {
    flex: 0.8;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .acomp-score-num-clear {
    font-size: 52px;
    font-weight: 800;
    color: #1E293B;
    font-family: monospace, sans-serif;
  }

  .acomp-score-divider-clear {
    font-size: 22px;
    color: #94A3B8;
    opacity: 0.5;
  }

  /* --- Fila de Espera --- */
  .acomp-queue-header-clear {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .acomp-queue-header-clear h3 {
    font-size: 15px;
    font-weight: 700;
    color: #0F172A;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .acomp-queue-header-clear span {
    font-size: 12px;
    color: #64748B;
    font-weight: 600;
  }

  .acomp-queue-items-clear {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .acomp-queue-item-clear {
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(30, 41, 59, 0.01);
  }

  .acomp-queue-team-info-clear {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .acomp-queue-badge-stack-clear {
    display: flex;
    align-items: center;
  }

  .acomp-queue-avatar-clear {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid #FFFFFF;
    margin-left: -6px;
    object-fit: cover;
  }

  .acomp-queue-avatar-clear:first-child {
    margin-left: 0;
  }

  .acomp-queue-pos-clear {
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
    color: #64748B;
    width: 16px;
  }

  .acomp-queue-team-name-clear {
    font-size: 14px;
    font-weight: 600;
    color: #1E293B;
  }

  .acomp-next-badge-clear {
    background: #D1FAE5;
    color: #065F46;
    border: 1px solid #A7F3D0;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  /* --- Regra Ativa --- */
  .acomp-rule-title-clear {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6B21A8;
    background: #FAF5FF;
    border: 1px solid #F3E8FF;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .acomp-rule-desc-clear {
    font-size: 13px;
    color: #1E293B;
    font-weight: 700;
  }

  .acomp-card-clear {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid rgba(0, 0, 0, 0.04);
    box-shadow: 0 4px 14px rgba(30, 41, 59, 0.03);
    display: flex;
    flex-direction: column;
    width: 100%;
    box-sizing: border-box;
  }

  @media (max-width: 768px) {
    .acomp-card-clear {
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.05);
      width: 100%;
      box-sizing: border-box;
    }

    .acomp-scoreboard-row-clear {
      gap: 4px;
    }

    .acomp-team-box-clear {
      padding: 10px 4px;
      min-height: auto;
    }

    .acomp-score-num-clear {
      font-size: 36px;
    }

    .acomp-player-name-clear {
      max-width: 65px;
      font-size: 11px;
    }
  }
</style>

<!-- SELETOR DE DATA DA PELADA -->
<div class="acomp-card-clear" style="padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
  <span style="font-size: 13px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 6px;">
    📅 Selecionar Pelada:
  </span>
  <select id="acomp-select-pelada-date" class="form-control" style="font-size: 13px; font-weight: 600; color: #1E293B; background: #F8FAFC; border: 1px solid #CBD5E1; padding: 6px 12px; border-radius: 8px; cursor: pointer; max-width: 260px; flex: 1;">
    <option value="">Carregando datas...</option>
  </select>
</div>

<!-- CRONÔMETRO -->
<div class="acomp-card-clear acomp-timer-wrapper-clear">
  <div class="acomp-timer-time-clear" id="acomp-timer-text">08:00</div>
  <div class="acomp-progress-container-clear">
    <div id="acomp-timer-progress" class="acomp-progress-bar-clear" style="width: 0%;"></div>
  </div>
  <div class="acomp-status-badge-clear">
    <span id="acomp-timer-dot" class="acomp-pulse-dot-clear paused"></span>
    <span id="acomp-timer-status">Aguardando início</span>
  </div>
</div>

<!-- SCOREBOARD AO VIVO -->
<div class="acomp-card-clear acomp-score-card-clear">
  <div class="acomp-live-tag-clear">
    <span></span>AO VIVO
  </div>

  <div class="acomp-scoreboard-row-clear">
    <!-- TIME A (ESQUERDA - Alinhado à Direita, Olho à Esquerda com alinhamento vertical central) -->
    <div class="acomp-team-box-clear" id="acomp-team-a" style="text-align: right;">
      <div id="emblem-acomp-team-a" style="width: 48px; height: 54px; margin-left: auto; margin-bottom: 6px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));"></div>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 4px;">
        <button id="acomp-btn-view-team-a" style="border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; padding: 0 6px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; line-height: 1;" title="Ver escalação do Time A">👁️</button>
        <div class="acomp-team-title-clear" id="acomp-team-a-name" style="text-align: right; margin: 0; line-height: 1.2; display: inline-flex; align-items: center;">Time A</div>
      </div>
      <div id="acomp-team-a-status" style="min-height: 16px; margin-bottom: 4px; text-align: right;"></div>
      <!-- Gols do Time A (Abaixo do nome, alinhados à direita) -->
      <div id="acomp-team-a-goals" style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; font-weight: 700; color: #0F172A; margin-top: 6px;"></div>
    </div>

    <!-- PLACAR CENTRAL -->
    <div class="acomp-score-display-clear">
      <span class="acomp-score-num-clear" id="acomp-score-a">0</span>
      <span class="acomp-score-divider-clear">x</span>
      <span class="acomp-score-num-clear" id="acomp-score-b">0</span>
    </div>

    <!-- TIME B (DIREITA - Alinhado à Esquerda, Olho à Direita com alinhamento vertical central) -->
    <div class="acomp-team-box-clear" id="acomp-team-b" style="text-align: left;">
      <div id="emblem-acomp-team-b" style="width: 48px; height: 54px; margin-right: auto; margin-bottom: 6px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));"></div>
      <div style="display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 4px;">
        <div class="acomp-team-title-clear" id="acomp-team-b-name" style="text-align: left; margin: 0; line-height: 1.2; display: inline-flex; align-items: center;">Time B</div>
        <button id="acomp-btn-view-team-b" style="border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; padding: 0 6px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; line-height: 1;" title="Ver escalação do Time B">👁️</button>
      </div>
      <div id="acomp-team-b-status" style="min-height: 16px; margin-bottom: 4px; text-align: left;"></div>
      <!-- Gols do Time B (Abaixo do nome, alinhados à esquerda) -->
      <div id="acomp-team-b-goals" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; font-weight: 700; color: #0F172A; margin-top: 6px;"></div>
    </div>
  </div>

  <!-- GOLS REGISTRADOS NA PARTIDA AO VIVO -->
  <div id="acomp-live-goals-feed" style="margin-top: 14px; padding: 10px 14px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E2E8F0; display: none;">
    <!-- Populado via JS em tempo real -->
  </div>
</div>

<!-- FILA DE ESPERA -->
<div class="acomp-card-clear acomp-queue-wrapper-clear" style="padding: 16px;">
  <div class="acomp-queue-header-clear">
    <h3>
      <i data-feather="list" style="width: 16px; height: 16px; color: #64748B;"></i>
      Fila de Espera
    </h3>
    <span id="acomp-queue-count">—</span>
  </div>
  <div class="acomp-queue-items-clear" id="acomp-queue-list">
    <!-- Populado via JS -->
  </div>
</div>

<!-- HISTÓRICO DE PARTIDAS RECENTES -->
<div class="acomp-card-clear" style="padding: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 8px;">
    <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 8px;">
      <i data-feather="check-circle" style="width: 16px; height: 16px; color: #10B981;"></i>
      Histórico de Partidas Recentes
    </h3>
    <span style="font-size: 11px; font-weight: 700; color: #10B981; background: #D1FAE5; padding: 2px 8px; border-radius: 6px;">JOGOS ENCERRADOS</span>
  </div>
  <div id="acomp-recent-matches" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;">
    <!-- Inserido dinamicamente -->
  </div>
</div>

<!-- REGRA ATIVA (RODAPÉ) -->
<div class="acomp-card-clear" style="text-align: center; padding: 16px;">
  <div class="acomp-rule-title-clear">Regra Ativa</div>
  <div class="acomp-rule-desc-clear" id="acomp-rule-text">REGRA PADRÃO: MAIS GOLS VENCE</div>
</div>

<script>
  if (window.feather) feather.replace();
</script>
