<!-- pages/jogador/ranking.html — Classificação e Resultados (Módulo Jogador) -->

<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- FILTRO DE PELADA -->
  <div class="form-group" style="margin-bottom: 0;">
    <select id="ranking-pelada-filter" class="form-control">
      <option value="all">📊 Geral (Todas as Peladas)</option>
    </select>
  </div>

  <!-- TABELA DE CLASSIFICAÇÃO -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🏆 Classificação do Dia</h3>
    <div class="table-responsive">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Time</th>
            <th style="text-align: center;">P</th>
            <th style="text-align: center;">J</th>
            <th style="text-align: center;">V</th>
            <th style="text-align: center;">SG</th>
          </tr>
        </thead>
        <tbody id="ranking-teams-body">
          <!-- Inserido via JS -->
          <tr>
            <td colspan="6" style="text-align: center; padding: 32px; color: var(--text-caption);">
              Nenhuma partida registrada hoje.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ARTILHARIA -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">⚽ Artilharia</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Jogador</th>
            <th style="text-align: center;">Gols</th>
            <th style="text-align: center;">Assist.</th>
            <th style="text-align: center;">Jogos</th>
          </tr>
        </thead>
        <tbody id="ranking-scorers-body">
          <tr>
            <td colspan="5" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Sem artilheiros registrados.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>
