<!-- pages/jogador/financeiro.html — Carteira e Transações do Atleta -->
<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- CARD DE SALDO PESSOAL -->
  <div class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 16px; position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid rgba(0, 0, 0, 0.04); box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03);">
    <!-- Fundo abstrato sutil -->
    <div style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; border-radius: 50%; background: rgba(2, 132, 199, 0.05); filter: blur(20px); pointer-events: none;"></div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start; z-index: 1;">
      <div>
        <p class="text-inter" style="font-size: 13px; color: var(--text-caption); margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Meu Saldo Atual</p>
        <h2 id="player-wallet-balance" class="sports-font" style="font-size: 38px; font-weight: 900; margin: 6px 0 0; color: #0f172a; line-height: 1.1;">R$ 0,00</h2>
      </div>
      <div style="background: rgba(2, 132, 199, 0.1); color: #0284C7; width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
        💳
      </div>
    </div>

    <!-- Mensagem de Alerta se Devedor -->
    <div id="player-wallet-debt-alert" style="display: none; align-items: center; gap: 10px; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px 16px; border-radius: 12px; margin-top: 4px; z-index: 1;">
      <span style="font-size: 18px;">⚠️</span>
      <p class="text-inter" style="margin: 0; font-size: 12px; font-weight: 600; color: #EF4444; line-height: 1.4;">
        Você possui pendência financeira. Realize o acerto com o gestor via Pix.
      </p>
    </div>

    <!-- Caixa de Chave Pix se Devedor -->
    <div id="player-wallet-pix-box" style="display: none; flex-direction: column; gap: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px; margin-top: 4px; z-index: 1;">
      <span style="font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase;">Chave Pix do Grupo:</span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <span id="player-wallet-pix-key" style="font-size: 13px; font-weight: 800; color: #0284C7; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">--</span>
        <button id="btn-player-wallet-copy-pix" class="btn btn-sm" style="background: #0284C7; color: #FFFFFF; font-weight: 700; border-radius: 8px; padding: 6px 12px; border: none; cursor: pointer; white-space: nowrap; font-size: 11px;">
          📋 Copiar
        </button>
      </div>
    </div>
  </div>

  <!-- HISTÓRICO DE LANÇAMENTOS -->
  <div class="card" style="padding: 0; overflow: hidden; background: #FFFFFF; border: 1px solid rgba(0, 0, 0, 0.04); box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03); border-radius: 16px;">
    <div style="padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 20px;">📜</span>
      <h3 class="text-inter" style="margin: 0; font-weight: 800; font-size: 16px; color: var(--text-heading);">Histórico de Lançamentos</h3>
    </div>

    <div style="overflow-x: auto; width: 100%;">
      <table class="table-custom" style="width: 100%; border-collapse: collapse; margin-bottom: 0;">
        <thead>
          <tr>
            <th style="padding: 14px 20px; font-weight: 700; font-size: 12px; color: #64748B; text-transform: uppercase;">Data</th>
            <th style="padding: 14px 20px; font-weight: 700; font-size: 12px; color: #64748B; text-transform: uppercase;">Descrição</th>
            <th style="padding: 14px 20px; font-weight: 700; font-size: 12px; color: #64748B; text-transform: uppercase; text-align: right;">Valor</th>
          </tr>
        </thead>
        <tbody id="player-finance-transactions-body">
          <tr>
            <td colspan="3" style="text-align: center; padding: 32px; color: var(--text-caption);" class="text-inter">
              Carregando histórico...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
