<!-- pages/jogador/dashboard.html — Dashboard do Atleta (Módulo Jogador Redesign Claro) -->

<!-- ESTILOS EXCLUSIVOS DO REDESIGN CLARO DA DASHBOARD -->
<style>
  /* --- Card FIFA Claro --- */
  .card-fifa {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
    padding: 24px !important;
    display: flex;
    flex-direction: column;
    gap: 20px;
    color: #1E293B !important;
  }

  .card-fifa-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-fifa-header .sports-font {
    font-family: 'Inter', sans-serif !important;
    font-size: 20px;
    letter-spacing: 1px;
    color: #0284C7 !important; /* Azul sofisticado */
  }

  .badge-gk {
    background: #FEF3C7 !important;
    color: #D97706 !important;
    border: 1px solid #FDE68A !important;
    padding: 2px 8px !important;
    border-radius: 6px !important;
    font-size: 11px !important;
    font-weight: 700 !important;
  }

  .card-fifa-profile {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .fifa-avatar-container {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid #E2E8F0 !important;
    overflow: hidden;
    background: #F1F5F9;
  }

  .fifa-avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #player-card-name {
    color: #1E293B !important; /* Nome do atleta escuro */
    font-weight: 700 !important;
    margin-top: 0;
  }

  /* --- Saldo do Jogador --- */
  .card-fifa-balance {
    background: #E6FDF4 !important; /* Verde menta claro */
    border: 1px solid #C6F6D5 !important;
    border-radius: 12px !important;
    padding: 14px 18px !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-fifa-balance.negative {
    background: #FEF2F2 !important; /* Vermelho claro */
    border-color: #FCA5A5 !important;
  }

  .card-fifa-balance .label {
    font-size: 12px;
    font-weight: 700;
    color: #047857 !important;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-fifa-balance.negative .label {
    color: #B91C1C !important;
  }

  .card-fifa-balance .value {
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #059669 !important; /* Verde escuro */
    font-family: monospace, sans-serif;
  }

  .card-fifa-balance.negative .value {
    color: #DC2626 !important; /* Vermelho escuro */
  }

  /* Botões */
  .card-fifa .btn-outline-secondary {
    border: 1px solid #E2E8F0 !important;
    color: #475569 !important;
    background: #FFFFFF !important;
    font-weight: 600 !important;
    border-radius: 8px !important;
  }

  .card-fifa .btn-outline-secondary:hover {
    background: #F1F5F9 !important;
    border-color: #CBD5E1 !important;
  }

  .card-fifa .btn-accent {
    background: #0284C7 !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1) !important;
  }

  .card-fifa .btn-accent:hover {
    background: #0369a1 !important;
    box-shadow: 0 6px 15px rgba(2, 132, 199, 0.2) !important;
  }

  /* --- Próximas Peladas --- */
  #next-matches-list {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
  }

  /* --- Partida Ao Vivo (Dashboard) --- */
  .live-match-card {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
    padding: 32px 20px 24px !important;
    position: relative;
    color: #1E293B !important;
  }

  .live-badge {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #D1FAE5 !important;
    border: 1px solid #A7F3D0 !important;
    color: #065F46 !important;
    font-size: 10px !important;
    font-weight: 700 !important;
    padding: 3px 12px !important;
    border-radius: 100px !important;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .live-badge span {
    width: 6px;
    height: 6px;
    background-color: #34D399 !important;
    border-radius: 50% !important;
    display: inline-block;
    animation: acomp-pulse-clear 1.5s infinite;
  }

  .scoreboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    gap: 8px;
  }

  .score-team {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .score-team:last-child {
    justify-content: flex-end;
  }

  .team-color-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .team-name {
    font-size: 14px;
    font-weight: 600;
    color: #1E293B !important;
  }

  .score-numbers {
    font-size: 32px !important;
    font-weight: 800 !important;
    color: #1E293B !important;
    font-family: monospace, sans-serif;
  }

  .score-divider {
    font-size: 18px !important;
    color: #94A3B8 !important;
    opacity: 0.5;
  }

  .match-timer-container {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .match-timer-bar {
    width: 100%;
    height: 6px;
    background: #F1F5F9 !important;
    border-radius: 100px;
    overflow: hidden;
  }

  .match-timer-progress {
    height: 100%;
    background: linear-gradient(90deg, #34D399 0%, #0284C7 100%) !important;
  }

  .match-timer-text {
    font-size: 14px !important;
    font-weight: 700 !important;
    color: #64748B !important;
    font-family: monospace, sans-serif;
  }

  /* --- Fila de Espera --- */
  .queue-container {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
    padding: 16px !important;
  }

  .queue-item {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    border-radius: 12px !important;
    padding: 12px 16px !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    box-shadow: 0 4px 10px rgba(30, 41, 59, 0.01) !important;
  }

  .queue-item:last-child {
    margin-bottom: 0;
  }

  .queue-item .pos {
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
    color: #0284C7 !important;
    margin-right: 12px;
  }

  .queue-item span {
    color: #1E293B !important;
  }

  @keyframes acomp-pulse-clear {
    0% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    }
    70% {
      transform: scale(1);
      box-shadow: 0 0 0 8px rgba(52, 211, 153, 0);
    }
    100% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
    }
  }
</style>

<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- CARD FIFA DO JOGADOR -->
  <div class="card-fifa" id="player-fifa-card">
    <div class="card-fifa-header">
      <span class="sports-font">PELADA PRO</span>
      <span id="player-gk-badge" class="badge-gk hidden">🧤 GK</span>
    </div>

    <div class="card-fifa-profile">
      <div class="fifa-avatar-container">
        <img id="player-avatar"
          src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=150&auto=format&fit=crop&q=80"
          alt="Avatar" class="fifa-avatar">
      </div>
      <div>
        <h3 id="player-card-name" style="font-size: 24px; line-height: 1; color: #1E293B; margin-bottom: 4px;">—</h3>
        <p class="text-inter" style="font-size: 12px; color: #64748B; font-weight: 600;">
          <span id="player-card-age">—</span> ANOS
        </p>
        <div id="player-card-stars" class="fifa-stars" style="margin-top: 6px;"></div>
      </div>
    </div>

    <div id="player-card-balance" class="card-fifa-balance">
      <div>
        <span class="label">Meu Saldo</span>
      </div>
      <span id="player-balance-value" class="value">R$ 0,00</span>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn btn-outline-secondary" style="flex: 1; padding: 10px;"
        onclick="Router.openModal('atleta', { playerId: Auth.currentUser?.id, mode: 'edit' })">
        ✏️ Editar Perfil
      </button>
      <button class="btn btn-accent" style="flex: 1.8; padding: 10px;"
        onclick="Router.navigate('#/jogador/convocacao')">
        📋 Convocação
      </button>
    </div>
  </div>

  <!-- PRÓXIMAS PELADAS -->
  <section>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #0F172A;">📅 Próximas Peladas</h3>
      <span id="dashboard-group-name" class="text-inter"
        style="font-size: 11px; font-weight: 700; color: #475569; background: #E2E8F0; padding: 4px 10px; border-radius: 20px;">—</span>
    </div>

    <div id="next-matches-list" style="padding: 0; overflow: hidden;">
      <div class="skeleton" style="height: 52px; margin: 12px; border-radius: 8px;"></div>
      <div class="skeleton" style="height: 52px; margin: 12px; border-radius: 8px;"></div>
    </div>
  </section>

  <!-- PARTIDA ATIVA (ao vivo) -->
  <section id="live-section">
    <h3 style="margin: 0 0 12px; font-size: 18px; font-weight: 700; color: #0F172A;">⚽ Partida Ao Vivo</h3>

    <div class="live-match-card">
      <div class="live-badge">
        <span></span>AO VIVO
      </div>
      <div class="scoreboard">
        <div class="score-team">
          <div id="live-team-a-indicator" class="team-color-indicator" style="background: #2196F3;"></div>
          <span id="live-team-a-name" class="team-name">Time A</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <span id="live-team-a-score" class="score-numbers">0</span>
          <span class="score-divider">:</span>
          <span id="live-team-b-score" class="score-numbers">0</span>
        </div>
        <div class="score-team">
          <div id="live-team-b-indicator" class="team-color-indicator" style="background: #FFC107;"></div>
          <span id="live-team-b-name" class="team-name">Time B</span>
        </div>
      </div>

      <div class="match-timer-container">
        <div class="match-timer-bar">
          <div id="live-match-timer-progress" class="match-timer-progress" style="width: 0%;"></div>
        </div>
        <div id="live-match-timer" class="match-timer-text">00:00</div>
      </div>
    </div>
  </section>

  <!-- FILA DE ESPERA -->
  <section>
    <h3 style="margin: 0 0 12px; font-size: 18px; font-weight: 700; color: #0F172A;">⏳ Fila de Espera</h3>
    <div id="dashboard-queue-list" class="queue-container" style="margin-bottom: 0;">
      <div class="queue-list">
        <!-- Inserido via JS -->
      </div>
    </div>
  </section>

</main>
