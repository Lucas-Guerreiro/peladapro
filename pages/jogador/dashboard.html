<!-- pages/jogador/dashboard.html — Dashboard do Atleta (Módulo Jogador Redesign Claro) -->

<!-- ESTILOS EXCLUSIVOS DO REDESIGN CLARO DA DASHBOARD -->
<style>
  /* --- Card FIFA Claro --- */
  .card-fifa {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
    padding: 24px !important;
    display: flex;
    flex-direction: column;
    gap: 20px;
    color: #1E293B !important;
  }

  .card-fifa-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-fifa-header .sports-font {
    font-family: 'Inter', sans-serif !important;
    font-size: 20px;
    letter-spacing: 1px;
    color: #0284C7 !important; /* Azul sofisticado */
  }

  .badge-gk {
    background: #FEF3C7 !important;
    color: #D97706 !important;
    border: 1px solid #FDE68A !important;
    padding: 2px 8px !important;
    border-radius: 6px !important;
    font-size: 11px !important;
    font-weight: 700 !important;
  }

  .card-fifa-profile {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .fifa-avatar-container {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid #E2E8F0 !important;
    overflow: hidden;
    background: #F1F5F9;
  }

  .fifa-avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #player-card-name {
    color: #1E293B !important; /* Nome do atleta escuro */
    font-weight: 700 !important;
    margin-top: 0;
  }

  /* --- Saldo do Jogador --- */
  .card-fifa-balance {
    background: #E6FDF4 !important; /* Verde menta claro */
    border: 1px solid #C6F6D5 !important;
    border-radius: 12px !important;
    padding: 14px 18px !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-fifa-balance.negative {
    background: #FEF2F2 !important; /* Vermelho claro */
    border-color: #FCA5A5 !important;
  }

  .card-fifa-balance .label {
    font-size: 12px;
    font-weight: 700;
    color: #047857 !important;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-fifa-balance.negative .label {
    color: #B91C1C !important;
  }

  .card-fifa-balance .value {
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #059669 !important; /* Verde escuro */
    font-family: monospace, sans-serif;
  }

  .card-fifa-balance.negative .value {
    color: #DC2626 !important; /* Vermelho escuro */
  }

  /* Botões */
  .card-fifa .btn-outline-secondary {
    border: 1px solid #E2E8F0 !important;
    color: #475569 !important;
    background: #FFFFFF !important;
    font-weight: 600 !important;
    border-radius: 8px !important;
  }

  .card-fifa .btn-outline-secondary:hover {
    background: #F1F5F9 !important;
    border-color: #CBD5E1 !important;
  }

  .card-fifa .btn-accent {
    background: #0284C7 !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1) !important;
  }

  .card-fifa .btn-accent:hover {
    background: #0369a1 !important;
    box-shadow: 0 6px 15px rgba(2, 132, 199, 0.2) !important;
  }

  /* --- Próximas Peladas --- */
  #next-matches-list {
    background: #FFFFFF !important;
    border: 1px solid rgba(0, 0, 0, 0.04) !important;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03) !important;
    border-radius: 16px !important;
  }


</style>

<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- CARD FIFA DO JOGADOR -->
  <div class="card-fifa" id="player-fifa-card">
    <div class="card-fifa-header">
      <span class="sports-font">PELADA PRO</span>
      <span id="player-gk-badge" class="badge-gk hidden">🧤 GK</span>
    </div>

    <div class="card-fifa-profile">
      <div class="fifa-avatar-container">
        <img id="player-avatar"
          src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=150&auto=format&fit=crop&q=80"
          alt="Avatar" class="fifa-avatar">
      </div>
      <div>
        <h3 id="player-card-name" style="font-size: 24px; line-height: 1; color: #1E293B; margin-bottom: 4px;">—</h3>
        <p class="text-inter" style="font-size: 12px; color: #64748B; font-weight: 600;">
          <span id="player-card-age">—</span> ANOS
        </p>
      </div>
    </div>

    <div id="player-card-balance" class="card-fifa-balance">
      <div>
        <span class="label">Meu Saldo</span>
      </div>
      <span id="player-balance-value" class="value">R$ 0,00</span>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn btn-outline-secondary" style="flex: 1; padding: 10px;"
        onclick="Router.openModal('atleta', { playerId: Auth.currentUser?.id, mode: 'edit' })">
        ✏️ Editar Perfil
      </button>
      <button class="btn btn-accent" style="flex: 1.8; padding: 10px;"
        onclick="Router.navigate('#/jogador/convocacao')">
        📋 Convocação
      </button>
    </div>
  </div>

  <!-- PRÓXIMAS PELADAS -->
  <section>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #0F172A;">📅 Próximas Peladas</h3>
      <span id="dashboard-group-name" class="text-inter"
        style="font-size: 11px; font-weight: 700; color: #475569; background: #E2E8F0; padding: 4px 10px; border-radius: 20px;">—</span>
    </div>

    <div id="next-matches-list" style="padding: 0; overflow: hidden;">
      <div class="skeleton" style="height: 52px; margin: 12px; border-radius: 8px;"></div>
      <div class="skeleton" style="height: 52px; margin: 12px; border-radius: 8px;"></div>
    </div>
  </section>

  <!-- Google AdSense Banner Slot (Ligar / Desligar via Configurações) -->
  <div id="adsense-dashboard-banner" style="display: none; margin-top: 16px;"></div>

</main>
