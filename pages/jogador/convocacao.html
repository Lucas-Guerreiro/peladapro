<!-- pages/jogador/convocacao.html — Confirmação de Presença (Módulo Jogador) -->

<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- SELEÇÃO DE PELADA E DATA -->
  <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 20px;">
    <h3 style="margin: 0; font-size: 20px;">📋 Confirmar Presença</h3>

    <div class="form-group" style="margin-bottom: 0;">
      <label class="form-label" for="select-conv-pelada">Grupo / Pelada</label>
      <select id="select-conv-pelada" class="form-control">
        <option value="">▼ Selecione o grupo</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 0;">
      <label class="form-label" for="select-conv-data">Data da Pelada</label>
      <select id="select-conv-data" class="form-control" disabled style="background: var(--background);">
        <option value="">Selecione um grupo primeiro</option>
      </select>
    </div>
  </div>

  <!-- LISTA DE CONFIRMADOS -->
  <div class="card" style="padding: 0; overflow: hidden;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color);">
      <h4 class="text-inter" style="margin: 0; font-weight: 700; color: var(--text-heading);">✅ Lista de Convocados</h4>
      <span id="conv-counter" class="text-inter"
        style="font-size: 13px; font-weight: 700; background: #F1F5F9; padding: 4px 10px; border-radius: 12px; color: #475569;">
        0 / 0
      </span>
    </div>

    <div id="confirmed-list" style="max-height: 320px; overflow-y: auto;">
      <div class="empty-state" style="padding: 32px;">
        <span style="font-size: 32px;">📋</span>
        <p class="text-inter" style="font-size: 14px;">Selecione uma pelada acima para ver a lista.</p>
      </div>
    </div>
  </div>

  <!-- MEU STATUS -->
  <div id="my-status-card" class="card" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-bottom: 4px; text-transform: uppercase; font-weight: 600;">Meu Status</p>
      <span id="my-status-badge" class="badge-status pendente">⏳ Pendente</span>
    </div>
    <div style="text-align: right;">
      <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-bottom: 4px; text-transform: uppercase; font-weight: 600;">Meu Saldo</p>
      <span id="my-balance-conv" class="sports-font" style="font-size: 22px; color: #059669; font-weight: 800;">R$ 0,00</span>
    </div>
  </div>

  <!-- ALERTA FILA DE ESPERA -->
  <div id="waitlist-alert" class="card" style="display: none; align-items: center; gap: 12px; background: #FFFBEB; border: 1.5px solid #F59E0B; padding: 12px 16px; border-radius: 12px;">
    <span style="font-size: 20px;">⏳</span>
    <p id="waitlist-alert-text" class="text-inter" style="margin: 0; font-size: 13px; font-weight: 600; color: #B45309; line-height: 1.4;"></p>
  </div>

  <!-- CARD DE RECARGA E PAGAMENTO VIA PIX -->
  <div id="pix-payment-card" class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid #BAE6FD; background: #F0F9FF;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
      <h4 style="margin: 0; font-size: 15px; font-weight: 700; color: #0369A1; display: flex; align-items: center; gap: 8px;">
        📱 Pagamento & Recarga via Pix
      </h4>
      <span style="font-size: 11px; font-weight: 700; background: #E0F2FE; color: #0369A1; padding: 3px 8px; border-radius: 6px;">VALIDAÇÃO AUTOMÁTICA</span>
    </div>

    <!-- Informações da Chave Pix -->
    <div id="pix-info-box" style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div>
          <span style="font-size: 11px; font-weight: 600; color: #64748B; text-transform: uppercase;">Beneficiário (Titular):</span>
          <div id="pix-display-beneficiario" style="font-size: 14px; font-weight: 700; color: #0F172A;">--</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px dashed #E2E8F0; padding-top: 8px;">
        <div style="flex: 1; min-width: 0;">
          <span style="font-size: 11px; font-weight: 600; color: #64748B; text-transform: uppercase;">Chave Pix:</span>
          <div id="pix-display-key" style="font-size: 14px; font-weight: 800; color: #0284C7; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--</div>
        </div>
        <button id="btn-copy-pix-key" class="btn btn-sm" style="background: #0284C7; color: #FFFFFF; font-weight: 700; border-radius: 8px; padding: 6px 12px; border: none; cursor: pointer; white-space: nowrap;">
          📋 Copiar Chave
        </button>
      </div>
    </div>

    <!-- Area de Upload do Comprovante -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label class="form-label" style="font-weight: 700; font-size: 13px; color: #0F172A; margin: 0;">
        📤 Anexar Comprovante do Pix (Imagem ou PDF):
      </label>
      <input type="file" id="pix-receipt-file-input" accept="image/*,application/pdf" class="form-control" style="background: #FFFFFF; padding: 8px;">
      <button id="btn-upload-pix-receipt" class="btn btn-accent btn-md" style="width: 100%; font-weight: 700; height: 42px; margin-top: 4px;">
        🔍 Validar & Enviar Comprovante
      </button>
    </div>
  </div>

  <!-- BOTÕES DE AÇÃO -->
  <div style="display: flex; gap: 12px;">
    <button id="btn-conv-add" class="btn btn-primary btn-lg" style="flex: 2;">
      ➕ Confirmar Presença
    </button>
    <button id="btn-conv-remove" class="btn btn-danger btn-md" style="flex: 1;">
      ➖ Cancelar
    </button>
  </div>

</main>

<!-- Container de modal injetado pelo router -->
<div id="modal-container-root"></div>
