<!-- pages/jogador/layout.html — Layout Unificado do Jogador -->
<style>
  /* Ocultar o cabeçalho global antigo caso esteja no DOM */
  #main-header, .main-header {
    display: none !important;
  }

  /* --- Reset e Wrapper Principal --- */
  .acomp-web-body {
    background: linear-gradient(135deg, #F0F4F8 0%, #E2E8F0 100%);
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #1E293B;
    padding: 30px 20px;
    margin: 0;
  }

  .acomp-center-container {
    max-width: 980px; /* Largura perfeita para cartões e tabelas */
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* --- Responsividade Geral --- */
  @media (max-width: 768px) {
    .acomp-web-body {
      padding: 12px;
      background: #F8FAFC;
      box-sizing: border-box;
    }
    .acomp-center-container {
      max-width: 100%;
      width: 100%;
      gap: 12px;
      box-sizing: border-box;
    }
  }

  /* --- Cabeçalho Unificado Desktop (Card Único Claro) --- */
  .acomp-header-unified-card {
    background: #FFFFFF;
    border-radius: 16px;
    border: 1px solid rgba(0, 0, 0, 0.04);
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .acomp-header-row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .acomp-logo-clear {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #0F172A;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .acomp-logo-clear span {
    color: #0284C7; /* Azul padrão */
  }

  .acomp-user-info-clear {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .acomp-user-name-clear {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
  }

  .acomp-btn-sair-clear {
    background: rgba(239, 68, 68, 0.08);
    color: #EF4444;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .acomp-btn-sair-clear:hover {
    background: #EF4444;
    color: #FFFFFF;
  }

  .acomp-nav-desktop-clear {
    display: flex;
    gap: 6px;
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    padding-top: 14px;
    justify-content: flex-start;
    flex-wrap: wrap;
    overflow: hidden;
  }

  .acomp-nav-item-clear {
    background: transparent;
    border: none;
    padding: 8px 11px;
    color: #475569;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    text-align: center;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1.2;
  }

  .acomp-nav-item-clear svg {
    width: 16px;
    height: 16px;
    stroke-width: 2;
    color: #64748B;
    transition: color 0.2s ease;
  }

  .acomp-nav-item-clear:hover {
    color: #0284C7;
    background: rgba(2, 132, 199, 0.05);
  }

  .acomp-nav-item-clear:hover svg {
    color: #0284C7;
  }

  .acomp-nav-item-clear.active {
    background: rgba(2, 132, 199, 0.09);
    color: #0284C7;
    font-weight: 700;
  }

  .acomp-nav-item-clear.active svg {
    color: #0284C7;
    stroke-width: 2.2;
  }

  /* --- Cabeçalho Unificado Mobile --- */
  .acomp-header-mobile-unified {
    display: none;
  }

  @media (max-width: 768px) {
    .acomp-header-unified-card {
      display: none;
    }
    .acomp-header-mobile-unified {
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      position: sticky;
      top: 12px;
      z-index: 100;
      padding: 12px 16px;
      box-sizing: border-box;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.03);
    }
    .acomp-header-mobile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
  }

  .acomp-mobile-dropdown {
    display: none;
    flex-direction: column;
    background: #FFFFFF;
    padding: 12px 0 8px;
    gap: 8px;
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    margin-top: 12px;
  }

  .acomp-mobile-dropdown button {
    background: transparent;
    border: none;
    text-align: left;
    padding: 10px 10px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .acomp-mobile-dropdown button svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
    color: #64748B;
  }

  .acomp-mobile-dropdown button:hover {
    background: rgba(2, 132, 199, 0.04);
    color: #0284C7;
  }

  .acomp-mobile-dropdown button:hover svg {
    color: #0284C7;
  }

  .acomp-mobile-dropdown button.active {
    color: #0284C7;
    background: rgba(2, 132, 199, 0.08);
    font-weight: 700;
  }

  .acomp-mobile-dropdown button.active svg {
    color: #0284C7;
  }
</style>

<div class="acomp-web-body">
  <div class="acomp-center-container">

    <!-- CABEÇALHO UNIFICADO DESKTOP -->
    <header class="acomp-header-unified-card">
      <div class="acomp-header-row1">
        <div class="acomp-logo-clear">
          <i data-feather="target" style="stroke-width: 2.5; color: #0284C7; width: 24px; height: 24px;"></i>
          PELADA<span>PRO</span>
        </div>
        <div class="acomp-user-info-clear">
          <!-- Toggle Switch de Perfil (Exclusivo para tipo 'ambos') -->
          {{ROLE_TOGGLE}}

          <button class="btn-global-modo-noturno" onclick="window.App.toggleModoNoturnoGlobal()" title="Alternar Modo Noturno no Tema do Time" style="display: inline-flex; align-items: center; gap: 6px;">
            <i data-feather="moon" style="width: 14px; height: 14px;"></i>
            <span class="lbl-modo-noturno-txt">Modo Noturno</span>
          </button>
          <button class="btn btn-sm" onclick="window.PWAInstaller.triggerInstall()" style="background: #0284C7; color: #FFF; font-weight: 700; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
            <i data-feather="download" style="width: 14px; height: 14px;"></i>
            <span>Instalar App</span>
          </button>
          <span class="acomp-user-name-clear" id="layout-user-name-desktop">{{USER_NAME}}</span>
          <button class="acomp-btn-sair-clear" onclick="Auth.logout()">SAIR</button>
        </div>
      </div>
      
      <nav class="acomp-nav-desktop-clear">
        <button class="acomp-nav-item-clear tab-btn" data-name="dashboard" onclick="Router.navigate('#/jogador/dashboard')">
          <i data-feather="home"></i>
          <span>Dashboard</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="convocacao" onclick="Router.navigate('#/jogador/convocacao')">
          <i data-feather="check-circle"></i>
          <span>Convocação</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="arrecadacao" onclick="Router.navigate('#/jogador/arrecadacao')">
          <i data-feather="heart"></i>
          <span>Vaquinha / Pix</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="acompanhamento" onclick="Router.navigate('#/jogador/acompanhamento')">
          <i data-feather="activity"></i>
          <span>Acompanhamento</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="ranking" onclick="Router.navigate('#/jogador/ranking')">
          <i data-feather="award"></i>
          <span>Ranking</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="desempenho" onclick="Router.navigate('#/jogador/desempenho')">
          <i data-feather="trending-up"></i>
          <span>Desempenho</span>
        </button>
        <button class="acomp-nav-item-clear tab-btn" data-name="financeiro" onclick="Router.navigate('#/jogador/financeiro')">
          <i data-feather="dollar-sign"></i>
          <span>Financeiro</span>
        </button>
      </nav>
    </header>

    <!-- CABEÇALHO UNIFICADO MOBILE -->
    <header class="acomp-header-mobile-unified">
      <div class="acomp-header-mobile-row">
        <div class="acomp-logo-clear">
          <i data-feather="target" style="stroke-width: 2.5; color: #0284C7; width: 20px; height: 20px;"></i>
          PELADA<span>PRO</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="btn-global-modo-noturno-icon" onclick="window.App.toggleModoNoturnoGlobal()" title="Alternar Modo Noturno" style="display: inline-flex; align-items: center; justify-content: center; background: #F1F5F9; border: 1px solid #CBD5E1; border-radius: 8px; padding: 6px; cursor: pointer;">
            <i data-feather="moon" style="width: 16px; height: 16px; color: #0F172A;"></i>
          </button>
          <button class="acomp-hamburger-btn" onclick="AcompanhamentoGlobal.toggleMobileMenu()">☰</button>
        </div>
      </div>
      
      {{ROLE_TOGGLE_HEADER_MOBILE}}
      
      <div class="acomp-mobile-dropdown" id="acomp-mobile-dropdown">
        <div class="acomp-dropdown-user" id="layout-user-name-mobile" style="font-size: 13px; font-weight: 700; color: #0F172A; padding: 4px 8px; margin-bottom: 4px;">{{USER_NAME}}</div>
        
        <button class="tab-btn" data-name="dashboard" onclick="Router.navigate('#/jogador/dashboard'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="home"></i> Dashboard
        </button>
        <button class="tab-btn" data-name="convocacao" onclick="Router.navigate('#/jogador/convocacao'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="check-circle"></i> Convocação
        </button>
        <button class="tab-btn" data-name="arrecadacao" onclick="Router.navigate('#/jogador/arrecadacao'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="heart"></i> Vaquinha / Pix
        </button>
        <button class="tab-btn" data-name="acompanhamento" onclick="Router.navigate('#/jogador/acompanhamento'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="activity"></i> Acompanhamento
        </button>
        <button class="tab-btn" data-name="ranking" onclick="Router.navigate('#/jogador/ranking'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="award"></i> Ranking
        </button>
        <button class="tab-btn" data-name="desempenho" onclick="Router.navigate('#/jogador/desempenho'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="trending-up"></i> Desempenho
        </button>
        <button class="tab-btn" data-name="financeiro" onclick="Router.navigate('#/jogador/financeiro'); AcompanhamentoGlobal.closeMobileMenu();">
          <i data-feather="dollar-sign"></i> Financeiro
        </button>
        <button class="tab-btn" onclick="window.PWAInstaller.triggerInstall(); AcompanhamentoGlobal.closeMobileMenu();" style="color: #0284C7; font-weight: 700;">
          <i data-feather="download"></i> Instalar App
        </button>
        <button class="tab-btn" onclick="window.App.toggleModoNoturnoGlobal(); AcompanhamentoGlobal.closeMobileMenu();" style="font-weight: 700;">
          <i data-feather="moon"></i> <span class="lbl-modo-noturno-txt">Modo Noturno</span>
        </button>
        <button class="tab-btn" onclick="Auth.logout()" style="color: #EF4444; font-weight: 700;">
          <i data-feather="log-out"></i> Sair do App
        </button>
      </div>
    </header>

    <!-- PONTO DE INJEÇÃO DAS PÁGINAS INDIVIDUAIS -->
    <div id="player-tab-content-container" style="display: flex; flex-direction: column; gap: 20px; width: 100%;"></div>

  </div>
</div>
