<!-- pages/jogador/desempenho.html — Estatísticas Individuais (Módulo Jogador) -->

<main style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- FILTRO -->
  <div class="form-group" style="margin-bottom: 0;">
    <select id="desempenho-pelada-filter" class="form-control">
      <option value="all">📊 Geral (Todas as Peladas)</option>
    </select>
  </div>

  <!-- ARTILHARIA -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🏅 Artilharia</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Jogador</th>
            <th style="text-align: center;">Gols</th>
            <th style="text-align: center; font-size: 14px;">Jogos</th>
          </tr>
        </thead>
        <tbody id="desempenho-artilharia-body">
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum dado disponível.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MELHOR JOGADOR -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🎖️ Melhor Jogador</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Jogador</th>
            <th style="text-align: center;">Pts</th>
            <th style="text-align: center; font-size: 14px;">Jogos</th>
          </tr>
        </thead>
        <tbody id="desempenho-rating-body">
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum dado disponível.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MELHOR GOLEIRO -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🧤 Goleiros</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Goleiro</th>
            <th style="text-align: center;">Partidas</th>
          </tr>
        </thead>
        <tbody id="desempenho-goleiros-body">
          <tr>
            <td colspan="3" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum goleiro encontrado.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MEU DESEMPENHO PESSOAL -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">👤 Meu Desempenho</h3>
    <div id="my-personal-stats" class="grid-2" style="gap: 16px;">
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-gols" style="font-size: 40px; color: #6B21A8; font-weight: 800;">0</div>
        <p class="text-inter" style="font-size: 12px; color: #64748B; margin-top: 4px; text-transform: uppercase; font-weight: 700;">Gols</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-partidas" style="font-size: 40px; color: #0284C7; font-weight: 800;">0</div>
        <p class="text-inter" style="font-size: 12px; color: #64748B; margin-top: 4px; text-transform: uppercase; font-weight: 700;">Partidas</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-rating" style="font-size: 40px; color: #D97706; font-weight: 800;">0,0</div>
        <p class="text-inter" style="font-size: 12px; color: #64748B; margin-top: 4px; text-transform: uppercase; font-weight: 700;">Pontos 🎖️</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-saldo" style="font-size: 32px; color: #059669; font-weight: 800;">R$0</div>
        <p class="text-inter" style="font-size: 12px; color: #64748B; margin-top: 4px; text-transform: uppercase; font-weight: 700;">Saldo</p>
      </div>
    </div>
  </section>

</main>
