<!-- pages/jogador/desempenho.html — Estatísticas Individuais (Módulo Jogador) -->

<!-- NAV DE ABAS INTERNAS -->
<nav class="tabs-navigation" id="jogador-tabs-nav" style="background: var(--primary); padding: 0 16px; margin-bottom: 0; border-bottom: none;">
  <button class="tab-btn" style="color: rgba(255,255,255,0.5);"
    onclick="Router.navigate('#/jogador/dashboard')">Dashboard</button>
  <button class="tab-btn" style="color: rgba(255,255,255,0.5);"
    onclick="Router.navigate('#/jogador/convocacao')">Convocação</button>
  <button class="tab-btn" style="color: rgba(255,255,255,0.5);"
    onclick="Router.navigate('#/jogador/acompanhamento')">Acompanhamento</button>
  <button class="tab-btn" style="color: rgba(255,255,255,0.5);"
    onclick="Router.navigate('#/jogador/ranking')">Ranking</button>
  <button class="tab-btn active" style="color: var(--secondary); border-bottom-color: var(--secondary);"
    onclick="Router.navigate('#/jogador/desempenho')">Desempenho</button>
</nav>

<main style="padding: 20px; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">

  <!-- FILTRO -->
  <div class="form-group" style="margin-bottom: 0;">
    <select id="desempenho-pelada-filter" class="form-control">
      <option value="all">📊 Geral (Todas as Peladas)</option>
    </select>
  </div>

  <!-- ARTILHARIA -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🏅 Artilharia</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Jogador</th>
            <th style="text-align: center;">Gols</th>
            <th style="text-align: center; font-size: 14px;">Jogos</th>
          </tr>
        </thead>
        <tbody id="desempenho-artilharia-body">
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum dado disponível.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MELHOR JOGADOR -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">⭐ Melhor Avaliado</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Jogador</th>
            <th style="text-align: center;">Média</th>
            <th style="text-align: center; font-size: 14px;">Jogos</th>
          </tr>
        </thead>
        <tbody id="desempenho-rating-body">
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum dado disponível.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MELHOR GOLEIRO -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">🧤 Goleiros</h3>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table-custom">
        <thead>
          <tr>
            <th style="width: 48px;">#</th>
            <th>Goleiro</th>
            <th style="text-align: center;">Partidas</th>
          </tr>
        </thead>
        <tbody id="desempenho-goleiros-body">
          <tr>
            <td colspan="3" style="text-align: center; padding: 24px; color: var(--text-caption);">
              Nenhum goleiro encontrado.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- MEU DESEMPENHO PESSOAL -->
  <section>
    <h3 style="font-size: 20px; margin-bottom: 12px;">👤 Meu Desempenho</h3>
    <div id="my-personal-stats" class="grid-2" style="gap: 16px;">
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-gols" style="font-size: 40px; color: var(--secondary);">0</div>
        <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-top: 4px; text-transform: uppercase; font-weight: 600;">Gols</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-partidas" style="font-size: 40px; color: var(--accent);">0</div>
        <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-top: 4px; text-transform: uppercase; font-weight: 600;">Partidas</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-rating" style="font-size: 40px; color: var(--warning);">—</div>
        <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-top: 4px; text-transform: uppercase; font-weight: 600;">Média ⭐</p>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div class="sports-font" id="my-stat-saldo" style="font-size: 32px; color: var(--primary);">R$0</div>
        <p class="text-inter" style="font-size: 12px; color: var(--text-caption); margin-top: 4px; text-transform: uppercase; font-weight: 600;">Saldo</p>
      </div>
    </div>
  </section>

</main>
