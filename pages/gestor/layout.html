<!-- pages/gestor/layout.html — Layout Unificado do Gestor -->
<style>
  /* Ocultar o cabeçalho global antigo caso esteja no DOM */
  #main-header, .main-header {
    display: none !important;
  }

  /* --- Reset e Wrapper Principal --- */
  .gestor-web-body {
    background: linear-gradient(135deg, #F0F4F8 0%, #E2E8F0 100%);
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #1E293B;
    padding: 30px 20px;
    margin: 0;
  }

  .gestor-center-container {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* --- Responsividade Geral --- */
  @media (max-width: 768px) {
    .gestor-web-body {
      padding: 12px;
      background: #F8FAFC;
      box-sizing: border-box;
    }
    .gestor-center-container {
      max-width: 100%;
      width: 100%;
      gap: 12px;
      box-sizing: border-box;
    }
  }

  /* --- Cabeçalho Unificado Desktop (Card Único Claro) --- */
  .gestor-header-unified-card {
    background: #FFFFFF;
    border-radius: 16px;
    border: 1px solid rgba(0, 0, 0, 0.04);
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.03);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .gestor-header-row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .gestor-logo-clear {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #0F172A;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gestor-logo-clear span {
    color: #0284C7; /* Azul Gestor */
  }

  .gestor-badge-role {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    background: #E0F2FE;
    color: #0369A1;
    padding: 3px 8px;
    border-radius: 12px;
    letter-spacing: 0.5px;
  }

  .gestor-user-info-clear {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .gestor-user-name-clear {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
  }

  .gestor-btn-sair-clear {
    background: rgba(239, 68, 68, 0.08);
    color: #EF4444;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .gestor-btn-sair-clear:hover {
    background: #EF4444;
    color: #FFFFFF;
  }

  .gestor-nav-desktop-clear {
    display: flex;
    gap: 6px;
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    padding-top: 14px;
    justify-content: flex-start;
    flex-wrap: wrap;
    overflow: hidden;
  }

  .gestor-nav-item-clear {
    background: transparent;
    border: none;
    padding: 8px 12px;
    color: #475569;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    text-align: center;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1.2;
  }

  .gestor-nav-item-clear svg {
    width: 16px;
    height: 16px;
    stroke-width: 2;
    color: #64748B;
    transition: color 0.2s ease;
  }

  .gestor-nav-item-clear:hover {
    color: #0284C7;
    background: rgba(2, 132, 199, 0.05);
  }

  .gestor-nav-item-clear:hover svg {
    color: #0284C7;
  }

  .gestor-nav-item-clear.active {
    background: rgba(2, 132, 199, 0.09);
    color: #0284C7;
    font-weight: 700;
  }

  .gestor-nav-item-clear.active svg {
    color: #0284C7;
    stroke-width: 2.2;
  }

  /* --- Cabeçalho Unificado Mobile --- */
  .gestor-header-mobile-unified {
    display: none;
  }

  @media (max-width: 768px) {
    .gestor-header-unified-card {
      display: none;
    }
    .gestor-header-mobile-unified {
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      position: sticky;
      top: 12px;
      z-index: 100;
      padding: 12px 16px;
      box-sizing: border-box;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.03);
    }
    .gestor-header-mobile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
  }

  .gestor-hamburger-btn,
  .acomp-hamburger-btn {
    background: #F1F5F9;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    font-size: 18px;
    color: #0F172A;
    cursor: pointer;
    padding: 4px 10px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .gestor-hamburger-btn:hover,
  .acomp-hamburger-btn:hover {
    background: #E2E8F0;
    color: #0284C7;
  }

  .gestor-mobile-dropdown {
    display: none;
    flex-direction: column;
    background: #FFFFFF;
    padding: 12px 0 8px;
    gap: 8px;
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    margin-top: 12px;
  }

  .gestor-mobile-dropdown button {
    background: transparent;
    border: none;
    text-align: left;
    padding: 10px 10px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gestor-mobile-dropdown button svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
    color: #64748B;
  }

  .gestor-mobile-dropdown button:hover {
    background: rgba(2, 132, 199, 0.04);
    color: #0284C7;
  }

  .gestor-mobile-dropdown button:hover svg {
    color: #0284C7;
  }

  .gestor-mobile-dropdown button.active {
    color: #0284C7;
    background: rgba(2, 132, 199, 0.08);
    font-weight: 700;
  }

  .gestor-mobile-dropdown button.active svg {
    color: #0284C7;
  }
</style>

<div class="gestor-web-body">
  <div class="gestor-center-container">

    <!-- CABEÇALHO UNIFICADO DESKTOP DO GESTOR -->
    <header class="gestor-header-unified-card">
      <div class="gestor-header-row1">
        <div class="gestor-logo-clear">
          <i data-feather="shield" style="stroke-width: 2.5; color: #0284C7; width: 24px; height: 24px;"></i>
          PELADA<span>PRO</span>
          <span class="gestor-badge-role">Painel Gestor</span>
        </div>

        <div class="gestor-user-info-clear">
          <!-- Toggle Switch de Perfil (Exclusivo para tipo 'ambos') -->
          {{ROLE_TOGGLE}}

          <button class="btn-global-modo-noturno" onclick="window.App.toggleModoNoturnoGlobal()" title="Alternar Modo Noturno no Tema do Time">
            🌙 <span class="lbl-modo-noturno-txt">Modo Noturno</span>
          </button>
          <button class="btn btn-sm" onclick="window.PWAInstaller.triggerInstall()" style="background: #0284C7; color: #FFF; font-weight: 700; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">📲 Instalar App</button>
          <span class="gestor-user-name-clear">{{USER_NAME}}</span>
          <button class="gestor-btn-sair-clear" onclick="Auth.logout()">SAIR</button>
        </div>
      </div>
      
      <!-- ABAS DE NAVEGAÇÃO DO GESTOR -->
      <nav class="gestor-nav-desktop-clear tabs-navigation">
        <button class="gestor-nav-item-clear tab-btn" data-name="atletas" onclick="Router.navigate('#/gestor/atletas')">
          <i data-feather="users"></i>
          <span>Elenco Atletas</span>
        </button>
        <button class="gestor-nav-item-clear tab-btn" data-name="times" onclick="Router.navigate('#/gestor/times')">
          <i data-feather="shield"></i>
          <span>Gerenciar Times</span>
        </button>
        <button class="gestor-nav-item-clear tab-btn" data-name="config" onclick="Router.navigate('#/gestor/config')">
          <i data-feather="settings"></i>
          <span>Configurações</span>
        </button>
        <button class="gestor-nav-item-clear tab-btn" data-name="formacao" onclick="Router.navigate('#/gestor/formacao')">
          <i data-feather="shuffle"></i>
          <span>Formação / Sorteio</span>
        </button>
        <button class="gestor-nav-item-clear tab-btn" data-name="partidas" onclick="Router.navigate('#/gestor/partidas')">
          <i data-feather="play-circle"></i>
          <span>Partida ao Vivo</span>
        </button>
        <button class="gestor-nav-item-clear tab-btn" data-name="financeiro" onclick="Router.navigate('#/gestor/financeiro')">
          <i data-feather="dollar-sign"></i>
          <span>Financeiro</span>
        </button>
      </nav>
    </header>

    <!-- CABEÇALHO UNIFICADO MOBILE DO GESTOR -->
    <header class="gestor-header-mobile-unified">
      <div class="gestor-header-mobile-row">
        <div class="gestor-logo-clear" style="font-size: 20px;">
          <i data-feather="shield" style="stroke-width: 2.5; color: #0284C7; width: 18px; height: 18px;"></i>
          PELADA<span>PRO</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="btn-global-modo-noturno-icon" onclick="window.App.toggleModoNoturnoGlobal()" title="Alternar Modo Noturno">🌙</button>
          <button class="acomp-hamburger-btn" onclick="GestorGlobal.toggleMobileMenu()">☰</button>
        </div>
      </div>
      
      {{ROLE_TOGGLE_HEADER_MOBILE}}
      
      <div class="gestor-mobile-dropdown" id="gestor-mobile-dropdown">
        <div style="font-size: 13px; font-weight: 700; color: #0F172A; padding: 4px 8px; margin-bottom: 4px; display:flex; align-items:center; justify-content:space-between;">
          <span>{{USER_NAME}}</span>
          <span class="gestor-badge-role">Gestor</span>
        </div>

        <button class="tab-btn" data-name="atletas" onclick="Router.navigate('#/gestor/atletas'); GestorGlobal.closeMobileMenu();">
          <i data-feather="users"></i> Elenco Atletas
        </button>
        <button class="tab-btn" data-name="times" onclick="Router.navigate('#/gestor/times'); GestorGlobal.closeMobileMenu();">
          <i data-feather="shield"></i> Gerenciar Times
        </button>
        <button class="tab-btn" data-name="config" onclick="Router.navigate('#/gestor/config'); GestorGlobal.closeMobileMenu();">
          <i data-feather="settings"></i> Configurações
        </button>
        <button class="tab-btn" data-name="formacao" onclick="Router.navigate('#/gestor/formacao'); GestorGlobal.closeMobileMenu();">
          <i data-feather="shuffle"></i> Formação / Sorteio
        </button>
        <button class="tab-btn" data-name="partidas" onclick="Router.navigate('#/gestor/partidas'); GestorGlobal.closeMobileMenu();">
          <i data-feather="play-circle"></i> Partida ao Vivo
        </button>
        <button class="tab-btn" data-name="financeiro" onclick="Router.navigate('#/gestor/financeiro'); GestorGlobal.closeMobileMenu();">
          <i data-feather="dollar-sign"></i> Financeiro
        </button>
        <button class="tab-btn" onclick="window.PWAInstaller.triggerInstall(); GestorGlobal.closeMobileMenu();" style="color: #0284C7; font-weight: 700;">
          <i data-feather="download"></i> Instalar App
        </button>
        <button class="tab-btn" onclick="window.App.toggleModoNoturnoGlobal(); GestorGlobal.closeMobileMenu();" style="font-weight: 700;">
          🌙 <span class="lbl-modo-noturno-txt">Modo Noturno</span>
        </button>
        <button class="tab-btn" onclick="Auth.logout()" style="color: #EF4444; font-weight: 700;">
          <i data-feather="log-out"></i> Sair do App
        </button>
      </div>
    </header>

    <!-- CONTAINER ONDE A PÁGINA DO GESTOR É INJETADA -->
    <div id="manager-tab-content-container" style="display: flex; flex-direction: column; gap: 20px; width: 100%;"></div>

  </div>
</div>
