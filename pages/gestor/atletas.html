<!-- Parcial: Gestão de Atletas -->
<div style="display: flex; flex-direction: column; gap: 20px; width: 100%;">

  <!-- Header Resumo Atletas (KPIs com Ícones Outline) -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
    <!-- 1. Total de Atletas -->
    <div class="card" style="padding: 16px 20px; border-left: 4px solid #0284C7; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-radius: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--text-caption); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Total de Atletas</span>
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(2, 132, 199, 0.1); color: #0284C7; display: flex; align-items: center; justify-content: center;">
          <i data-feather="users" style="width: 16px; height: 16px;"></i>
        </div>
      </div>
      <h2 id="summary-athletes-total" style="font-size: 28px; font-weight: 800; color: #0F172A; margin: 6px 0 0 0; font-family: 'Inter', sans-serif;">0</h2>
      <span style="font-size: 11px; color: var(--text-caption);">Cadastrados no grupo</span>
    </div>

    <!-- 2. Atletas Ativos -->
    <div class="card" style="padding: 16px 20px; border-left: 4px solid #10B981; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-radius: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--text-caption); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Atletas Ativos</span>
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(16, 185, 129, 0.1); color: #10B981; display: flex; align-items: center; justify-content: center;">
          <i data-feather="check-circle" style="width: 16px; height: 16px;"></i>
        </div>
      </div>
      <h2 id="summary-athletes-active" style="font-size: 28px; font-weight: 800; color: #10B981; margin: 6px 0 0 0; font-family: 'Inter', sans-serif;">0</h2>
      <span style="font-size: 11px; color: var(--text-caption);">Aptos para convocações</span>
    </div>

    <!-- 3. Inadimplentes -->
    <div class="card" style="padding: 16px 20px; border-left: 4px solid #EF4444; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-radius: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--text-caption); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Com Saldo Negativo</span>
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); color: #EF4444; display: flex; align-items: center; justify-content: center;">
          <i data-feather="alert-circle" style="width: 16px; height: 16px;"></i>
        </div>
      </div>
      <h2 id="summary-athletes-debtors" style="font-size: 28px; font-weight: 800; color: #EF4444; margin: 6px 0 0 0; font-family: 'Inter', sans-serif;">0</h2>
      <span style="font-size: 11px; color: var(--text-caption);">Pendências financeiras</span>
    </div>
  </div>

  <!-- Solicitações de Cadastro Pendentes -->
  <div id="pending-requests-card" class="card hidden" style="border-left: 4px solid #F59E0B; padding: 20px; border-radius: 12px; background: #FFFBEB;">
    <h3 style="font-size: 16px; font-weight: 800; color: #B45309; margin: 0 0 14px 0; display: flex; align-items: center; gap: 8px;">
      <i data-feather="user-check" style="width: 20px; height: 20px; color: #F59E0B;"></i>
      Solicitações de Cadastro Pendentes
    </h3>
    <div id="pending-requests-list" style="display: flex; flex-direction: column; gap: 10px;">
      <!-- Renderizado dinamicamente -->
    </div>
  </div>

  <!-- CARD PRINCIPAL: BARRA DE PESQUISA & LISTAGEM DO ELENCO -->
  <div class="card" style="padding: 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 16px;">
    <div class="search-bar-container" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 0; align-items: center;">
      <div style="position: relative; flex: 1; min-width: 240px;">
        <i data-feather="search" style="position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; color: #94A3B8;"></i>
        <input type="text" id="athlete-search-input" class="form-control" placeholder="Buscar atleta por nome ou e-mail..." style="padding-left: 36px; height: 42px; font-size: 13px; border-radius: 8px;">
      </div>
      <button id="btn-open-transfer-guest-modal" class="btn btn-outline" style="height: 42px; font-weight: 700; border-color: #CBD5E1; color: #334155; border-radius: 8px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px;">
        <i data-feather="git-pull-request" style="width: 15px; height: 15px; color: #0284C7;"></i>
        <span>Mesclar Convidado</span>
      </button>
      <button id="btn-open-add-athlete-modal" class="btn btn-primary" style="height: 42px; font-weight: 800; border-radius: 8px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: #0284C7;">
        <i data-feather="user-plus" style="width: 16px; height: 16px;"></i>
        <span>Cadastrar Atleta</span>
      </button>
      <button id="btn-export-athlete-names" class="btn" title="Exportar lista de nomes dos atletas" style="height: 42px; font-weight: 800; border-radius: 8px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: #10B981; color: #FFFFFF; border: none; cursor: pointer; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);">
        <i data-feather="download" style="width: 16px; height: 16px;"></i>
        <span>Exportar Nomes</span>
      </button>
    </div>

    <!-- Divisória suave -->
    <div style="height: 1px; background: #F1F5F9; width: 100%;"></div>

    <!-- Lista de Atletas -->
    <div id="athletes-list-container" style="display: flex; flex-direction: column; gap: 10px;">
      <!-- Renderizado dinamicamente -->
    </div>
  </div>

</div>
