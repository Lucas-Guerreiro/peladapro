<!-- Parcial: Formação de Times e Opções de Jogo -->
<!-- NAVEGAÇÃO ENTRE ABAS DO FLUXO: FORMAÇÃO vs MODO DE JOGO -->
<div class="formacao-tabs-bar" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px;">
  <button id="btn-tab-formacao-times" class="btn-subtab-formacao active" style="background: #E0F2FE; color: #0284C7; border: 1.5px solid #7DD3FC; border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;">
    👥 Formação dos Times
  </button>
  <button id="btn-tab-modo-jogo" class="btn-subtab-formacao" style="background: #F8FAFC; color: #64748B; border: 1.5px solid #CBD5E1; border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;">
    ⚙️ Modo de Jogo & Turno
  </button>
</div>

<!-- ========================================================================= -->
<!-- ABA 1: FORMAÇÃO DOS TIMES (Apenas Presença, Sorteio e Montagem das Equipes) -->
<!-- ========================================================================= -->
<div id="tab-content-formacao-times">
  <div class="grid-3" style="align-items: start; gap: 24px;">
    
    <!-- Coluna 1: Check-in de Presentes e Sorteio -->
    <div class="card" style="grid-column: span 1; padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
        <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">Presença no Dia</h3>
        <span id="checkin-count" class="badge-status confirmado" style="font-size: 11px;">0 Presentes</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; gap: 8px;">
          <button id="btn-presence-all" class="btn btn-sm" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 600; color: #1e3a8a; background: #e0f2fe; border: none; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Confirmar Todos</button>
          <button id="btn-presence-none" class="btn btn-sm" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 600; color: #64748b; background: #f1f5f9; border: none; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Limpar Todos</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-open-add-presence-modal" onclick="window.App.openAddPresenceModal()" class="btn btn-sm btn-primary" style="flex: 1.2; padding: 8px 6px; font-size: 11px; font-weight: 700; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: 'Inter', sans-serif;">
            ➕ Adicionar
          </button>

          <button id="btn-copy-presence-list" class="btn btn-sm" style="flex: 1.2; padding: 8px 6px; font-size: 11px; font-weight: 700; background: #25D366; color: #FFFFFF; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: 'Inter', sans-serif;" title="Copiar lista de confirmados formatada para o WhatsApp">
            📋 Copiar Lista
          </button>

          <button id="btn-export-presence-excel" class="btn btn-sm" style="flex: 0.9; padding: 8px 6px; font-size: 11px; font-weight: 700; background: #15803D; color: #FFFFFF; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: 'Inter', sans-serif;" title="Exportar lista de convocados em planilha Excel">
            📊 Excel
          </button>
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="select-manager-pelada" class="form-label">Pelada de Referência</label>
        <select id="select-manager-pelada" class="form-control">
          <!-- Inserido dinamicamente -->
        </select>
      </div>

      <!-- Lista de Jogadores Cadastrados no Grupo para Check-in -->
      <div id="checkin-list-container" style="max-height: 340px; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
        <!-- Check-ins dinâmicos -->
      </div>

      <!-- Lista de Espera da Pelada para o Gestor -->
      <div id="manager-waitlist-container" style="display: none; margin-bottom: 16px; border: 1.5px solid #F59E0B; border-radius: 12px; overflow: hidden; background: #FFFBEB;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #FEF3C7; border-bottom: 1px solid #FDE68A;">
          <span style="font-size: 13px; font-weight: 800; color: #92400E; display: flex; align-items: center; gap: 6px;">
            ⏳ Fila de Espera (<span id="manager-waitlist-count">0</span>)
          </span>
        </div>
        <div id="manager-waitlist-list" style="max-height: 180px; overflow-y: auto; padding: 8px;">
          <!-- Atletas da fila de espera para o gestor -->
        </div>
      </div>

      <button id="btn-draw-teams" class="btn btn-md btn-accent" style="width: 100%;">
        <i data-feather="shuffle" style="width: 18px; height: 18px;"></i> Sorteio Inteligente
      </button>
    </div>

    <!-- Coluna 2 e 3: Times Gerados -->
    <div class="card" style="grid-column: span 2; padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
        <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">Times Sorteados</h3>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span style="font-size: 11px; color: var(--text-caption); margin-right: 4px;">Arraste os jogadores para realizar trocas manuais</span>
          <button id="btn-cadastrar-nomes-times" class="btn btn-sm" style="border: 1.5px solid #0284C7; color: #0284C7; background: #F0F9FF; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; cursor: pointer;">
            🏷️ Nomes dos Times
          </button>
          <button id="btn-export-teams-whatsapp" class="btn btn-sm" style="background: #25D366; color: #FFFFFF; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px;" title="Exportar escalação dos times para o WhatsApp">
            💬 Exportar WhatsApp
          </button>
          <button id="btn-sync-teams-cloud" class="btn btn-sm btn-primary" style="font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif;">
            ☁️ Salvar na Nuvem
          </button>
          <button id="btn-clear-teams" class="btn btn-sm" style="border: 2px solid var(--danger); color: var(--danger); background: transparent; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; cursor: pointer;">
            🗑️ Limpar Times
          </button>
          <button id="btn-add-team-manual" class="btn btn-sm btn-outline-secondary" style="border: 2px solid var(--secondary); color: var(--secondary); background: transparent; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif;">
            <i data-feather="plus" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle;"></i> Criar Time
          </button>
        </div>
      </div>
      <!-- Grid onde os times sorteados e seus respectivos atletas são renderizados -->
      <div id="drawn-teams-container" class="teams-draft-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; min-height: 200px;">
        <!-- Preenchido dinamicamente via JS pelo renderDrawnTeams() -->
      </div>
    </div>

  </div>
</div>

<!-- ========================================================================= -->
<!-- ABA 2: MODO DE JOGO & TURNO (Configurações de Formato, Turno e Regras)      -->
<!-- ========================================================================= -->
<div id="tab-content-modo-jogo" style="display: none;">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;">
    
    <!-- Card de Opções de Formato -->
    <div class="card" style="padding: 24px;">
      <div style="margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <h3 style="margin: 0 0 4px 0; font-size: 18px; color: var(--text-heading); display: flex; align-items: center; gap: 8px;">
          <i data-feather="settings" style="width: 20px; height: 20px; color: #0284C7;"></i>
          Opções do Formato de Jogo
        </h3>
        <p style="margin: 0; font-size: 12px; color: var(--text-caption);">Escolha a modalidade da pelada e defina o turno para campeonatos.</p>
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label for="select-pelada-status" class="form-label">Status da Rodada</label>
        <select id="select-pelada-status" class="form-control">
          <option value="agendada">📅 Agendada (Ativa)</option>
          <option value="finalizada">🏁 Realizada (Encerrada)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label for="select-pelada-modo" class="form-label" style="font-weight: 700; color: var(--primary);">Formato do Dia</label>
        <select id="select-pelada-modo" class="form-control" style="font-weight: 600;" autocomplete="off" data-lpignore="true" data-form-type="other">
          <option value="normal">Pelada Normal (Reina Campo)</option>
          <option value="torneio">Mini Torneio (Misto: Tabela + Mata-Mata)</option>
          <option value="pontos_corridos">Mini Torneio (Pontos Corridos)</option>
          <option value="mata_mata_direto">Mini Torneio (Mata-Mata Direto)</option>
          <option value="torneio_livre">Torneio Livre (Confrontos Manuais)</option>
        </select>
      </div>

      <!-- SELEÇÃO DE TURNO DO TORNEIO (SOMENTE IDA OU IDA E VOLTA) -->
      <div class="form-group" id="container-turno-torneio" style="margin-bottom: 24px; display: none;">
        <label for="select-pelada-turno" class="form-label" style="font-weight: 700; color: #0284C7;">Turno da Fase de Grupos</label>
        <select id="select-pelada-turno" class="form-control" style="font-weight: 600;">
          <option value="ida">🔁 Somente Ida (Turno Único)</option>
          <option value="ida_volta" selected>🔄 Ida e Volta (Turno e Returno)</option>
        </select>
        <small id="lbl-turno-partidas-estimadas" style="display: block; margin-top: 6px; font-size: 11px; font-weight: 700; color: #0369A1;"></small>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 10px;">
        <button id="btn-ir-partida-ao-vivo" class="btn btn-primary" onclick="Router.navigate('#/gestor/partidas')" style="flex: 1; padding: 12px; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; cursor: pointer;">
          <i data-feather="play-circle" style="width: 18px; height: 18px;"></i>
          Ir para Partida ao Vivo
        </button>
      </div>
    </div>

    <!-- Card Explicativo das Regras do Modo Selecionado -->
    <div class="card" style="padding: 24px; background: #F8FAFC; border: 1.5px solid #E2E8F0;">
      <div style="margin-bottom: 14px; border-bottom: 1px solid #E2E8F0; padding-bottom: 8px;">
        <h4 id="modo-info-title" style="margin: 0 0 4px 0; font-size: 16px; font-weight: 800; color: #0F172A;">
          ℹ️ Como Funciona este Modo
        </h4>
        <span id="modo-info-badge" class="badge-status" style="background: #E0F2FE; color: #0369A1; font-weight: 800; font-size: 11px;">PONTOS CORRIDOS</span>
      </div>

      <div id="modo-info-body" style="font-size: 13px; line-height: 1.6; color: #334155;">
        <!-- Preenchido dinamicamente por updateModoInfoCard() -->
      </div>
    </div>

  </div>
</div>
