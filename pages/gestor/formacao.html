<!-- Parcial: Formação de Times e Sorteio (Apenas Presença e Sorteados) -->
<div class="grid-3" style="align-items: start; gap: 24px;">
  
  <!-- Coluna 1: Check-in de Presentes -->
  <div class="card" style="grid-column: span 1; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
      <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">Presença no Dia</h3>
      <span id="checkin-count" class="badge-status confirmado" style="font-size: 11px;">0 Presentes</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; gap: 8px;">
        <button id="btn-presence-all" class="btn btn-sm" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 600; color: #1e3a8a; background: #e0f2fe; border: none; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Confirmar Todos</button>
        <button id="btn-presence-none" class="btn btn-sm" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 600; color: #64748b; background: #f1f5f9; border: none; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Limpar Todos</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btn-open-add-presence-modal" class="btn btn-sm btn-primary" style="flex: 2; padding: 8px; font-size: 12px; font-weight: 700; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">
          ➕ Adicionar Atleta / Convidado
        </button>

        <button id="btn-export-presence-excel" class="btn btn-sm" style="flex: 1; padding: 8px; font-size: 12px; font-weight: 700; background: #15803D; color: #FFFFFF; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: 'Inter', sans-serif;" title="Exportar lista de convocados em planilha Excel">
          📊 Excel
        </button>
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label for="select-manager-pelada" class="form-label">Pelada de Referência</label>
      <select id="select-manager-pelada" class="form-control">
        <!-- Inserido dinamicamente -->
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="select-pelada-status" class="form-label">Status da Rodada</label>
      <select id="select-pelada-status" class="form-control">
        <option value="agendada">📅 Agendada (Ativa)</option>
        <option value="finalizada">🏁 Realizada (Encerrada)</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="select-pelada-modo" class="form-label" style="font-weight: 700; color: var(--primary);">Formato do Dia</label>
      <select id="select-pelada-modo" class="form-control" style="font-weight: 600;" autocomplete="off" data-lpignore="true" data-form-type="other">
        <option value="normal">Pelada Normal (Reina Campo)</option>
        <option value="torneio">Mini Torneio (Misto: Tabela + Mata-Mata)</option>
        <option value="pontos_corridos">Mini Torneio (Pontos Corridos)</option>
        <option value="mata_mata_direto">Mini Torneio (Mata-Mata Direto)</option>
        <option value="torneio_livre">Torneio Livre (Confrontos Manuais)</option>
      </select>
    </div>

    <!-- SELEÇÃO DE TURNO DO TORNEIO (SOMENTE IDA OU IDA E VOLTA) -->
    <div class="form-group" id="container-turno-torneio" style="margin-bottom: 16px; display: none;">
      <label for="select-pelada-turno" class="form-label" style="font-weight: 700; color: #0284C7;">Turno da Fase de Grupos</label>
      <select id="select-pelada-turno" class="form-control" style="font-weight: 600;">
        <option value="ida">🔁 Somente Ida (Turno Único)</option>
        <option value="ida_volta">🔄 Ida e Volta (Turno e Returno)</option>
      </select>
    </div>

    <!-- Lista de Jogadores Cadastrados no Grupo para Check-in -->
    <div id="checkin-list-container" style="max-height: 340px; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
      <!-- Check-ins dinâmicos -->
    </div>

    <!-- Lista de Espera da Pelada para o Gestor -->
    <div id="manager-waitlist-container" style="display: none; margin-bottom: 16px; border: 1.5px solid #F59E0B; border-radius: 12px; overflow: hidden; background: #FFFBEB;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #FEF3C7; border-bottom: 1px solid #FDE68A;">
        <span style="font-size: 13px; font-weight: 800; color: #92400E; display: flex; align-items: center; gap: 6px;">
          ⏳ Fila de Espera (<span id="manager-waitlist-count">0</span>)
        </span>
      </div>
      <div id="manager-waitlist-list" style="max-height: 180px; overflow-y: auto; padding: 8px;">
        <!-- Atletas da fila de espera para o gestor -->
      </div>
    </div>

    <button id="btn-draw-teams" class="btn btn-md btn-accent" style="width: 100%;">
      <i data-feather="shuffle" style="width: 18px; height: 18px;"></i> Sorteio Inteligente
    </button>
  </div>

  <!-- Coluna 2 e 3: Times Gerados -->
  <div class="card" style="grid-column: span 2; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
      <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">Times Sorteados</h3>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-size: 11px; color: var(--text-caption); margin-right: 4px;">Arraste os jogadores para realizar trocas manuais</span>
        <button id="btn-cadastrar-nomes-times" class="btn btn-sm" style="border: 1.5px solid #0284C7; color: #0284C7; background: #F0F9FF; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; cursor: pointer;">
          🏷️ Nomes dos Times
        </button>
        <button id="btn-sync-teams-cloud" class="btn btn-sm btn-primary" style="font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif;">
          ☁️ Salvar na Nuvem
        </button>
        <button id="btn-clear-teams" class="btn btn-sm" style="border: 2px solid var(--danger); color: var(--danger); background: transparent; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; cursor: pointer;">
          🗑️ Limpar Times
        </button>
        <button id="btn-add-team-manual" class="btn btn-sm btn-outline-secondary" style="border: 2px solid var(--secondary); color: var(--secondary); background: transparent; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-family: 'Inter', sans-serif;">
          <i data-feather="plus" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle;"></i> Criar Time
        </button>
      </div>
    </div>
    
  <!-- CARD EXCLUSIVO DE MINI TORNEIO (Classificação, Agenda de Jogos e Pódio) NA FORMAÇÃO -->
  <div id="formacao-tournament-card" class="card" style="grid-column: span 3; display: none; border-left: 4px solid #F59E0B; padding: 20px; margin-top: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; flex-wrap: wrap; gap: 8px;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #D97706; display: flex; align-items: center; gap: 8px;">
        🏆 Mini Torneio Rápido — Tabela & Jogos
      </h3>
      <span id="formacao-tournament-phase-badge" style="font-size: 11px; background: #FEF3C7; color: #B45309; font-weight: 700; padding: 4px 12px; border-radius: 20px;">
        FASE DE GRUPOS
      </span>
    </div>

    <!-- Tabela de Classificação -->
    <div style="margin-bottom: 20px;">
      <h4 style="margin: 0 0 8px 0; font-size: 14px; font-weight: 700; color: var(--text-heading);">📊 Tabela de Classificação</h4>
      <div class="table-responsive" style="overflow-x: auto;">
        <table class="table-custom" style="font-size: 12px; width: 100%;">
          <thead>
            <tr>
              <th style="text-align: center; width: 36px;">#</th>
              <th>Time</th>
              <th style="text-align: center;">J</th>
              <th style="text-align: center;">V</th>
              <th style="text-align: center;">E</th>
              <th style="text-align: center;">D</th>
              <th style="text-align: center;">GP</th>
              <th style="text-align: center;">GC</th>
              <th style="text-align: center;">SG</th>
              <th style="text-align: center; font-weight: 800; color: #D97706;">PTS</th>
            </tr>
          </thead>
          <tbody id="formacao-tournament-standings-body">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Agenda de Jogos do Torneio -->
    <div>
      <h4 style="margin: 0 0 8px 0; font-size: 14px; font-weight: 700; color: var(--text-heading);">🗓️ Agenda de Jogos do Torneio</h4>
      <div id="formacao-tournament-matches-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto;">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </div>

</div>
