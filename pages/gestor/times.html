<!-- Parcial: Gerenciamento de Times (pages/gestor/times.html) -->
<div>
  <!-- Header Resumo de Times -->
  <div class="grid-3" style="margin-bottom: 24px;">
    <div class="card" style="border-left: 4px solid #0284C7; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">Total de Times Criados</p>
      <h2 id="summary-teams-total" style="font-size: 32px; color: #0284C7; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
    <div class="card" style="border-left: 4px solid #10B981; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">Total de Atletas Escalados</p>
      <h2 id="summary-teams-athletes" style="font-size: 32px; color: #10B981; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
    <div class="card" style="border-left: 4px solid #F59E0B; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">Média por Time</p>
      <h2 id="summary-teams-avg" style="font-size: 32px; color: #F59E0B; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
  </div>

  <!-- Ações e Barra Superior -->
  <div class="card" style="margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <h3 style="font-size: 18px; font-weight: 800; color: var(--text-heading); display: flex; align-items: center; gap: 8px; margin: 0;">
          🛡️ Gerenciamento de Times da Pelada
        </h3>
        <p style="font-size: 13px; color: var(--text-caption); margin-top: 4px; margin-bottom: 0;">
          Cadastre novos times, edite os nomes com validação de unicidade, escolha emblemas e personalize as cores.
        </p>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btn-open-sorteio-from-times" class="btn btn-md btn-outline" style="font-weight: 700; border-color: #0284C7; color: #0284C7; border-width: 1.5px;">
          ⚡ Sortear Elenco
        </button>
        <button id="btn-add-new-team-page" class="btn btn-md btn-primary" style="font-weight: 800; background: linear-gradient(135deg, #0284C7, #0369A1); border: none;">
          ➕ Criar Novo Time
        </button>
      </div>
    </div>
  </div>

  <!-- Grid de Cards dos Times -->
  <div id="manager-teams-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
    <!-- Renderizado dinamicamente -->
  </div>
</div>
