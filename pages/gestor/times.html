<!-- Parcial: CRUD de Catálogo de Nomes de Times (pages/gestor/times.html) -->
<div>
  <!-- Header Resumo do Catálogo -->
  <div class="grid-3" style="margin-bottom: 24px;">
    <div class="card" style="border-left: 4px solid #0284C7; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">Total no Catálogo</p>
      <h2 id="summary-catalog-total" style="font-size: 32px; color: #0284C7; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
    <div class="card" style="border-left: 4px solid #10B981; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">No Banco PostgreSQL</p>
      <h2 id="summary-catalog-custom" style="font-size: 32px; color: #10B981; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
    <div class="card" style="border-left: 4px solid #8B5CF6; padding: 16px 20px;">
      <p style="font-size: 12px; color: var(--text-caption); text-transform: uppercase; font-weight: 700;">Padrões de Fallback</p>
      <h2 id="summary-catalog-default" style="font-size: 32px; color: #8B5CF6; margin-top: 4px; font-weight: 800;">0</h2>
    </div>
  </div>

  <!-- Ações e Barra Superior -->
  <div class="card" style="margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h3 style="font-size: 18px; font-weight: 800; color: var(--text-heading); display: flex; align-items: center; gap: 8px; margin: 0;">
          🛡️ Cadastro e Gerenciamento dos Nomes dos Times
        </h3>
        <p style="font-size: 13px; color: var(--text-caption); margin-top: 4px; margin-bottom: 0;">
          Gerencie o catálogo de nomes de times cadastrados do grupo. Esses nomes alimentam os seletores dos sorteios e partidas.
        </p>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; max-width: 500px;">
        <input 
          type="text" 
          id="team-catalog-search-input" 
          class="form-control" 
          placeholder="Buscar nome de time..." 
          style="flex: 1; min-width: 180px;"
        >
        <button id="btn-open-create-team-name-modal" class="btn btn-md btn-primary" style="font-weight: 800; background: linear-gradient(135deg, #0284C7, #0369A1); border: none; white-space: nowrap;">
          ➕ Cadastrar Novo Nome
        </button>
      </div>
    </div>
  </div>

  <!-- Lista do Catálogo de Nomes dos Times -->
  <div id="manager-team-catalog-list" style="display: flex; flex-direction: column; gap: 10px;">
    <!-- Renderizado dinamicamente -->
  </div>
</div>

<!-- MODAL: CADASTRAR / EDITAR NOME DE TIME DO CATÁLOGO -->
<div id="modal-edit-catalog-team" class="modal-backdrop" style="display: none;">
  <div class="modal-sheet" style="max-width: 440px;">
    <div class="modal-header">
      <h3 id="modal-catalog-title" class="modal-title" style="font-size: 18px; font-weight: 800; color: #0F172A;">
        ➕ Cadastrar Nome de Time
      </h3>
      <button class="modal-close-btn" id="btn-close-edit-catalog-modal">✕</button>
    </div>

    <form id="form-edit-catalog-team" onsubmit="return false;" style="padding: 16px 20px;">
      <input type="hidden" id="edit-catalog-team-id">

      <div style="margin-bottom: 16px;">
        <label for="edit-catalog-team-nome" class="form-label" style="font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; display: block;">
          Nome do Time <span style="color: #EF4444;">*</span>
        </label>
        <input 
          type="text" 
          id="edit-catalog-team-nome" 
          class="form-control" 
          placeholder="Ex: Flamengo, Colete Verde, Real Madrid..." 
          required
          style="font-weight: 700; font-size: 14px;"
        >
      </div>

      <div style="margin-bottom: 16px;">
        <label for="edit-catalog-team-cor" class="form-label" style="font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; display: block;">
          Cor Principal do Time
        </label>
        <div style="display: flex; align-items: center; gap: 12px; background: #F8FAFC; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0;">
          <input 
            type="color" 
            id="edit-catalog-team-cor" 
            value="#0284C7" 
            style="width: 40px; height: 32px; border: none; cursor: pointer; background: transparent;"
          >
          <span id="edit-catalog-color-preview-text" style="font-size: 13px; font-weight: 700; color: #0F172A;">#0284C7</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 24px;">
        <button type="button" class="btn btn-secondary" id="btn-cancel-edit-catalog-modal" style="flex: 1;">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-save-edit-catalog-team" style="flex: 1.5; font-weight: 800; background: linear-gradient(135deg, #0284C7, #0369A1); border: none;">
          Salvar Nome 💾
        </button>
      </div>
    </form>
  </div>
</div>
