<!-- Parcial: Controle da Partida e Filas de Espera -->
<div class="grid-3" style="align-items: start;">
  
  <!-- Coluna 1 e 2: Controle da Partida Ativa (Ocupa 2 colunas) -->
  <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 24px;">
    
    <!-- Card de Controle de Placar e Cronômetro (Design Premium Claro) -->
    <div class="card" style="background-color: var(--primary); color: #FFF; border: none; padding: 28px; font-family: 'Inter', sans-serif !important;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; gap: 16px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <h3 style="color: #FFF; margin: 0; font-size: 20px; font-weight: 700;">⏱️ Jogo ao Vivo / Placar</h3>
          <select id="partidas-select-pelada-date" class="form-control" style="background: rgba(255,255,255,0.15); color: #FFF; border: 1px solid rgba(255,255,255,0.3); font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; max-width: 260px;">
            <option value="">Carregando datas...</option>
          </select>
        </div>
        <span class="badge-status" id="match-live-status-badge" style="background: var(--secondary); color: var(--primary); font-weight: bold;">AGUARDANDO SORTEIO</span>
      </div>
      
      <div class="grid-3" style="align-items: center; margin-bottom: 24px; gap: 16px;">
        <!-- Time A (Olho + Placar + Gol) -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
          <!-- Botão Olho -->
          <button id="btn-view-team-a" class="btn btn-sm btn-outline-secondary" style="border-radius: 8px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.2); background: transparent;">
            <i data-feather="eye" style="width: 18px; height: 18px; color: #FFF;"></i>
          </button>
 
          <!-- Nome e Placar -->
          <div style="text-align: center;">
            <h4 style="font-family: 'Inter', sans-serif !important; font-size: 20px; font-weight: 800; color: var(--secondary); margin: 0; text-transform: uppercase; letter-spacing: 0.5px;" id="match-control-team-a">—</h4>
            <div id="match-control-team-a-status" style="min-height: 18px; margin-top: 4px;"></div>
            <!-- Autores de gols do Time A na partida ao vivo -->
            <div id="match-control-team-a-goals" style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; font-weight: 700; color: #34D399; margin-top: 4px;"></div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px;">
              <button class="btn btn-sm btn-outline-secondary btn-score-adjust" data-team="a" data-diff="-1" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: rgba(255,255,255,0.3); color: #fff; padding: 0; line-height: 1;">-</button>
              <span id="match-control-score-a" style="font-family: 'Inter', sans-serif !important; font-size: 40px; font-weight: 800; min-width: 40px; display: inline-block;">0</span>
              <button class="btn btn-sm btn-outline-secondary btn-score-adjust" data-team="a" data-diff="1" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: var(--secondary); color: var(--secondary); padding: 0; line-height: 1;">+</button>
            </div>
          </div>
 
          <!-- Botão Gol -->
          <button id="btn-goal-team-a" class="btn btn-sm btn-accent" style="padding: 6px 12px; font-weight: 700; font-size: 11px; border-radius: 8px; border: none; font-family: 'Inter', sans-serif !important; letter-spacing: 0.5px;">
            GOL
          </button>
        </div>
 
        <!-- Cronômetro Central (Retroativo com Ajuste de Minutos) -->
        <div style="text-align: center; border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); padding: 0 10px; display: flex; flex-direction: column; align-items: center; min-width: 150px;">
          
          <!-- Controles de Ajuste de Minutos (-1 / +1) -->
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; margin-top: 4px;">
            <!-- Botão -1 Minuto -->
            <button id="btn-timer-minus" class="btn btn-sm btn-outline-secondary" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: rgba(255,255,255,0.3); color: #fff; padding: 0; line-height: 1; font-size: 13px;" title="Subtrair 1 minuto">-1</button>
            
            <span id="match-control-timer" style="font-family: 'Inter', sans-serif !important; font-size: 38px; font-weight: 800; display: block; letter-spacing: 1px; color: #FFF; line-height: 1;">08:00</span>
            
            <!-- Botão +1 Minuto -->
            <button id="btn-timer-plus" class="btn btn-sm btn-outline-secondary" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: rgba(255,255,255,0.3); color: #fff; padding: 0; line-height: 1; font-size: 13px;" title="Somar 1 minuto">+1</button>
          </div>

          <div style="display: flex; justify-content: center; gap: 10px; width: 100%;">
            <button id="btn-timer-toggle" class="btn btn-sm btn-primary" style="padding: 6px 16px; font-weight: 700; flex: 1;">Iniciar</button>
            <button id="btn-timer-reset" class="btn btn-sm btn-outline-secondary" style="border-color: rgba(255,255,255,0.3); color: #fff; flex: 1;">Reset</button>
          </div>
        </div>
 
        <!-- Time B (Olho + Placar + Gol) -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
          <!-- Botão Olho -->
          <button id="btn-view-team-b" class="btn btn-sm btn-outline-secondary" style="border-radius: 8px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.2); background: transparent;">
            <i data-feather="eye" style="width: 18px; height: 18px; color: #FFF;"></i>
          </button>
 
          <!-- Nome e Placar -->
          <div style="text-align: center;">
            <h4 style="font-family: 'Inter', sans-serif !important; font-size: 20px; font-weight: 800; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: 0.5px;" id="match-control-team-b">—</h4>
            <div id="match-control-team-b-status" style="min-height: 18px; margin-top: 4px;"></div>
            <!-- Autores de gols do Time B na partida ao vivo -->
            <div id="match-control-team-b-goals" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; font-weight: 700; color: #34D399; margin-top: 4px;"></div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px;">
              <button class="btn btn-sm btn-outline-secondary btn-score-adjust" data-team="b" data-diff="-1" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: rgba(255,255,255,0.3); color: #fff; padding: 0; line-height: 1;">-</button>
              <span id="match-control-score-b" style="font-family: 'Inter', sans-serif !important; font-size: 40px; font-weight: 800; min-width: 40px; display: inline-block;">0</span>
              <button class="btn btn-sm btn-outline-secondary btn-score-adjust" data-team="b" data-diff="1" style="border-radius: 50%; width: 28px; height: 28px; font-weight: bold; border-color: var(--accent); color: var(--accent); padding: 0; line-height: 1;">+</button>
            </div>
          </div>
 
          <!-- Botão Gol -->
          <button id="btn-goal-team-b" class="btn btn-sm btn-accent" style="padding: 6px 12px; font-weight: 700; font-size: 11px; border-radius: 8px; border: none; font-family: 'Inter', sans-serif !important; letter-spacing: 0.5px;">
            GOL
          </button>
        </div>
      </div>
 
      <div style="display: flex; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; width: 100%;">
        <button id="btn-finish-match" class="btn btn-md btn-secondary" style="flex: 1; border: 2px solid var(--secondary); color: var(--secondary); background: transparent; font-weight: 700;">
          <i data-feather="check-circle" style="width: 18px; height: 18px;"></i> Lançar Resultado (Concluir Jogo)
        </button>
      </div>
    </div>

    <!-- Card de Histórico de Partidas Recentes -->
    <div class="card" style="padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
        <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">⚽ Histórico de Partidas Recentes</h3>
        <span class="badge-status confirmado" style="font-size: 11px; background: var(--success); color: #FFF;">JOGOS ENCERRADOS</span>
      </div>

      <!-- Lista de Partidas Recentes -->
      <div id="recent-matches-container" style="display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto;">
        <!-- Inserido dinamicamente -->
      </div>
    </div>
  </div>

  <!-- Coluna 3: Fila de Espera dos Times (Ocupa 1 coluna) -->
  <div class="card" style="grid-column: span 1; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
      <h3 style="margin: 0; font-size: 18px; color: var(--text-heading);">📋 Fila de Espera</h3>
      <span id="queue-count" class="badge-status pendente" style="font-size: 11px;">0 Times</span>
    </div>

    <!-- Lista Vertical da Fila de Espera -->
    <div id="wait-queue-container" style="display: flex; flex-direction: column; gap: 10px; min-height: 150px;">
      <!-- Inserido dinamicamente -->
    </div>
  </div>

</div>
