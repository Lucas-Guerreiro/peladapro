<!-- Parcial: Controle da Partida e Filas de Espera (Redesign Claro & Unificado com Módulo Atleta) -->

<!-- ESTILOS EXCLUSIVOS DO PLACAR E CRONÔMETRO DO GESTOR -->
<style>
  /* --- Cronômetro Moderno Claro --- */
  .gestor-timer-wrapper {
    align-items: center;
    text-align: center;
  }

  .gestor-timer-time {
    font-size: 44px;
    font-weight: 300;
    font-family: monospace, sans-serif;
    color: #0F172A;
    letter-spacing: 2px;
    margin-bottom: 8px;
    line-height: 1;
  }

  .gestor-progress-container {
    width: 100%;
    height: 8px;
    background: #F1F5F9;
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .gestor-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #34D399 0%, #0284C7 100%);
    border-radius: 100px;
    transition: width 0.3s ease;
  }

  .gestor-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #64748B;
    font-weight: 600;
  }

  .gestor-pulse-dot {
    width: 8px;
    height: 8px;
    background-color: #34D399;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    animation: gestor-pulse 2s infinite;
    display: inline-block;
  }

  .gestor-pulse-dot.paused {
    background-color: #F87171;
    animation: none;
    box-shadow: none;
  }

  @keyframes gestor-pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  /* --- Card de Placar (Fundo Claro Premium) --- */
  .gestor-score-card {
    position: relative;
    padding: 28px 20px 24px;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.02);
  }

  .gestor-live-tag {
    background: #D1FAE5;
    border: 1px solid #A7F3D0;
    color: #065F46;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .gestor-live-tag span {
    width: 6px;
    height: 6px;
    background-color: #34D399;
    border-radius: 50%;
    display: inline-block;
    animation: gestor-pulse 1.5s infinite;
  }

  .gestor-team-title {
    font-size: 16px;
    font-weight: 800;
    color: #0F172A;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .gestor-score-num {
    font-size: 52px;
    font-weight: 800;
    color: #0F172A;
    font-family: monospace, sans-serif;
    line-height: 1;
  }

  .gestor-score-divider {
    font-size: 24px;
    color: #94A3B8;
    opacity: 0.5;
  }

  .btn-adjust-score {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #CBD5E1;
    background: #F8FAFC;
    color: #0F172A;
    font-weight: 800;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    transition: all 0.2s;
  }
  .btn-adjust-score:hover {
    background: #E2E8F0;
    border-color: #94A3B8;
  }

  .btn-goal-trigger {
    background: #10B981;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .btn-goal-trigger:hover {
    background: #059669;
  }
</style>

<div class="grid-3" style="align-items: start; gap: 20px;">
  
  <!-- Coluna 1 e 2: Controle da Partida Ativa (Ocupa 2 colunas) -->
  <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 20px;">
    
    <!-- Card de Controle de Placar e Cronômetro (Design Claro & Unificado) -->
    <div class="gestor-score-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #E2E8F0; padding-bottom: 14px; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <span class="gestor-live-tag">
            <span></span>AO VIVO
          </span>
          <select id="partidas-select-pelada-date" class="form-control" style="background: #F8FAFC; color: #0F172A; border: 1px solid #CBD5E1; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; max-width: 260px;">
            <option value="">Carregando datas...</option>
          </select>
        </div>
        <span class="badge-status" id="match-live-status-badge" style="background: #E2E8F0; color: #475569; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 20px;">AGUARDANDO SORTEIO</span>
      </div>
      
      <!-- Cronômetro Central (Design do Atleta) -->
      <div class="gestor-timer-wrapper" style="margin-bottom: 24px;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;">
          <button id="btn-timer-minus" class="btn-adjust-score" title="Subtrair 1 minuto">-1</button>
          <div class="gestor-timer-time" id="match-control-timer">08:00</div>
          <button id="btn-timer-plus" class="btn-adjust-score" title="Somar 1 minuto">+1</button>
        </div>
        <div class="gestor-progress-container">
          <div id="gestor-timer-progress" class="gestor-progress-bar" style="width: 0%;"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
          <div class="gestor-status-badge">
            <span id="gestor-timer-dot" class="gestor-pulse-dot paused"></span>
            <span id="gestor-timer-status-text">Pronto para iniciar</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="btn-timer-toggle" class="btn btn-sm" style="background: #0284C7; color: #FFF; font-weight: 700; border-radius: 8px; padding: 6px 16px; border: none; cursor: pointer;">Iniciar</button>
            <button id="btn-timer-reset" class="btn btn-sm" style="background: #F1F5F9; color: #475569; font-weight: 600; border-radius: 8px; padding: 6px 14px; border: 1px solid #CBD5E1; cursor: pointer;">Reset</button>
          </div>
        </div>
      </div>

      <!-- Placar Central e Controle de Placar (Layout Fixo) -->
      <div style="background: #F8FAFC; padding: 18px; border-radius: 14px; border: 1px solid #E2E8F0; margin-bottom: 24px;">
        
        <!-- PARTE SUPERIOR FIXA: Nomes, Olho, Botões (- / + / GOL) e Placar 1 x 1 (Nunca move) -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
          
          <!-- Time A (ESQUERDA - Alinhado à Direita) -->
          <div id="acomp-team-a" style="flex: 1; text-align: right; display: flex; flex-direction: column; align-items: flex-end;">
            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 4px;">
              <button id="btn-view-team-a" style="border: 1px solid #CBD5E1; background: #FFFFFF; border-radius: 6px; padding: 0 6px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; line-height: 1;" title="Ver escalação do Time A">👁️</button>
              <h4 class="gestor-team-title" id="match-control-team-a" style="margin: 0;">Time A</h4>
            </div>
            <div id="match-control-team-a-status" style="min-height: 16px; margin-bottom: 6px; text-align: right;"></div>
            
            <!-- Placar e Botões Time A -->
            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
              <button class="btn-adjust-score btn-score-adjust" data-team="a" data-diff="-1">-</button>
              <button class="btn-adjust-score btn-score-adjust" data-team="a" data-diff="1" style="background: #D1FAE5; border-color: #A7F3D0; color: #065F46;">+</button>
              <button id="btn-goal-team-a" class="btn-goal-trigger">GOL ⚽</button>
            </div>
          </div>

          <!-- PLACAR CENTRAL (1 x 1 FIXO) -->
          <div style="text-align: center; padding: 0 10px; display: flex; align-items: center; justify-content: center; min-width: 100px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="gestor-score-num" id="match-control-score-a">0</span>
              <span class="gestor-score-divider">x</span>
              <span class="gestor-score-num" id="match-control-score-b">0</span>
            </div>
          </div>

          <!-- Time B (DIREITA - Alinhado à Esquerda) -->
          <div id="acomp-team-b" style="flex: 1; text-align: left; display: flex; flex-direction: column; align-items: flex-start;">
            <div style="display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 4px;">
              <h4 class="gestor-team-title" id="match-control-team-b" style="margin: 0;">Time B</h4>
              <button id="btn-view-team-b" style="border: 1px solid #CBD5E1; background: #FFFFFF; border-radius: 6px; padding: 0 6px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; line-height: 1;" title="Ver escalação do Time B">👁️</button>
            </div>
            <div id="match-control-team-b-status" style="min-height: 16px; margin-bottom: 6px; text-align: left;"></div>
            
            <!-- Placar e Botões Time B -->
            <div style="display: flex; align-items: center; justify-content: flex-start; gap: 8px;">
              <button id="btn-goal-team-b" class="btn-goal-trigger">GOL ⚽</button>
              <button class="btn-adjust-score btn-score-adjust" data-team="b" data-diff="-1">-</button>
              <button class="btn-adjust-score btn-score-adjust" data-team="b" data-diff="1" style="background: #D1FAE5; border-color: #A7F3D0; color: #065F46;">+</button>
            </div>
          </div>
        </div>

        <!-- PARTE INFERIOR SEPARADA: Lista de Autores de Gols e Assistências (Cresce para baixo sem mover o topo) -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 12px; padding-top: 8px;">
          <!-- Autores de gols do Time A (alinhado à direita) -->
          <div id="match-control-team-a-goals" style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; font-weight: 700; color: #0F172A;"></div>

          <!-- Espaço em branco central proporcional ao 1x1 -->
          <div style="min-width: 100px;"></div>

          <!-- Autores de gols do Time B (alinhado à esquerda) -->
          <div id="match-control-team-b-goals" style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; font-weight: 700; color: #0F172A;"></div>
        </div>

      </div>
 
      <!-- Rodapé de Ação: Concluir Partida -->
      <div style="display: flex; border-top: 1px solid #E2E8F0; padding-top: 16px; width: 100%;">
        <button id="btn-finish-match" class="btn" style="flex: 1; background: #10B981; color: #FFF; font-weight: 700; font-size: 14px; border-radius: 12px; height: 44px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);">
          <i data-feather="check-circle" style="width: 18px; height: 18px;"></i> Lançar Resultado (Concluir Jogo)
        </button>
      </div>
    </div>

    <!-- Card de Histórico de Partidas Recentes -->
    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.02);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #E2E8F0; padding-bottom: 10px;">
        <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 8px;">⚽ Histórico de Partidas Recentes</h3>
        <span style="font-size: 11px; background: #D1FAE5; color: #065F46; font-weight: 700; padding: 3px 10px; border-radius: 20px;">JOGOS ENCERRADOS</span>
      </div>

      <!-- Lista de Partidas Recentes -->
      <div id="recent-matches-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto;">
        <!-- Inserido dinamicamente -->
      </div>
    </div>
  </div>

  <!-- Coluna 3: Fila de Espera dos Times (Ocupa 1 coluna) -->
  <div style="grid-column: span 1; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.02);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #E2E8F0; padding-bottom: 10px;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 8px;">📋 Fila de Espera</h3>
      <span id="queue-count" style="font-size: 12px; color: #64748B; font-weight: 600;">0 Times</span>
    </div>

    <!-- Lista Vertical da Fila de Espera -->
    <div id="wait-queue-container" style="display: flex; flex-direction: column; gap: 8px; min-height: 150px;">
      <!-- Inserido dinamicamente -->
  </div>
</div>
