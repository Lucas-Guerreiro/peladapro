<!-- pages/login.html — Interface de Acesso ao PeladaPro -->
<div class="login-container" id="view-auth">

  <div class="card login-card">

    <!-- Brand -->
    <div class="login-brand">
      <h1>PELADA <span>PRO</span></h1>
    </div>
    <p class="login-subtitle">Gestão de Peladas Amadoras</p>

    <!-- LINHA DIVISÓRIA COM "OU" -->
    <div style="display: flex; align-items: center; gap: 12px; margin: 16px 0;">
      <div style="flex: 1; height: 1px; background: #ddd;"></div>
      <span style="color: #999; font-size: 13px;">ou</span>
      <div style="flex: 1; height: 1px; background: #ddd;"></div>
    </div>
    
    <!-- BOTÃO DO GOOGLE -->
    <button class="btn btn-outline btn-md google-btn" style="width:100%; margin-bottom:20px; font-weight: 600;" onclick="GoogleAuthModal.show()">
      <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align: middle; margin-right: 8px;">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.98-5.97z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entrar com Google
    </button>

    <!-- Formulário de Login -->
    <div id="auth-login-form">

      <div class="form-group" style="margin-top: 10px;">
        <label class="form-label" id="login-user-label" for="login-user" style="font-weight: 700;">E-mail <span style="color: var(--danger);">*</span></label>
        <input type="email" class="form-control" id="login-user"
          placeholder="Ex.: atleta@gmail.com"
          required
          onkeydown="if(event.key==='Enter') Auth.login()"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pass" style="font-weight: 700;">Senha <span style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="login-pass"
          placeholder="Digite sua senha"
          onkeydown="if(event.key==='Enter') Auth.login()"
        />
      </div>

      <button class="btn btn-secondary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;" onclick="Auth.login()">
        Entrar
      </button>

      <button class="btn btn-outline btn-md" style="width:100%; margin-bottom:20px; font-weight: 600;"
        onclick="document.getElementById('auth-login-form').classList.add('hidden'); document.getElementById('auth-register-form').classList.remove('hidden')">
        Criar Nova Conta
      </button>
    </div>

    <!-- Formulário de Cadastro -->
    <div id="auth-register-form" class="hidden">

      <div class="form-group" style="margin-top: 10px;">
        <label class="form-label" for="register-name" style="font-weight: 700;">Nome Completo <span style="color: var(--danger);">*</span></label>
        <input type="text" class="form-control" id="register-name" placeholder="Seu nome completo" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-email" style="font-weight: 700;">E-mail <span style="color: var(--danger);">*</span></label>
        <input type="email" class="form-control" id="register-email" placeholder="nome@provedor.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-password" style="font-weight: 700;">Senha <span style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="register-password" placeholder="Defina sua senha" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-confirm-password" style="font-weight: 700;">Confirmar Senha <span style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="register-confirm-password" placeholder="Confirme sua senha" required />
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;" onclick="Auth.register()">
        Criar Conta & Acessar
      </button>

      <button class="btn btn-outline btn-md" style="width:100%; font-weight: 600;"
        onclick="document.getElementById('auth-register-form').classList.add('hidden'); document.getElementById('auth-login-form').classList.remove('hidden')">
        Já tenho conta
      </button>
    </div>

  </div>

</div>
