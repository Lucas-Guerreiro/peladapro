<!-- pages/login.html — Interface de Acesso ao PeladaPro -->
<div class="login-container" id="view-auth">

  <div class="card login-card">

    <!-- Brand -->
    <div class="login-brand">
      <h1>PELADA <span>PRO</span></h1>
    </div>
    <p class="login-subtitle">Gestão de Peladas Amadoras</p>

    <!-- LINHA DIVISÓRIA COM "OU" -->
    <div style="display: flex; align-items: center; gap: 12px; margin: 16px 0;">
      <div style="flex: 1; height: 1px; background: #ddd;"></div>
      <span style="color: #999; font-size: 13px;">ou</span>
      <div style="flex: 1; height: 1px; background: #ddd;"></div>
    </div>

    <!-- Formulário de Login -->
    <div id="auth-login-form">

      <div class="form-group" style="margin-top: 10px;">
        <label class="form-label" id="login-user-label" for="login-user" style="font-weight: 700;">E-mail <span
            style="color: var(--danger);">*</span></label>
        <input type="email" class="form-control" id="login-user" placeholder="Ex.: atleta@gmail.com" required
          onkeydown="if(event.key==='Enter') Auth.login()" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pass" style="font-weight: 700;">Senha <span
            style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="login-pass" placeholder="Digite sua senha"
          onkeydown="if(event.key==='Enter') Auth.login()" />
      </div>

      <button class="btn btn-secondary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;"
        onclick="Auth.login()">
        Entrar
      </button>

      <a href="javascript:void(0)"
        onclick="document.getElementById('auth-login-form').classList.add('hidden'); document.getElementById('auth-recover-form').classList.remove('hidden')"
        style="display:block; text-align:center; margin-bottom:12px; color:#0284C7; font-weight:600; font-size:14px;">Esqueci
        minha senha</a>

      <!-- LINHA DIVISÓRIA COM "OU" -->
      <div style="display: flex; align-items: center; gap: 12px; margin: 16px 0;">
        <div style="flex: 1; height: 1px; background: #ddd;"></div>
        <span style="color: #999; font-size: 13px;">ou</span>
        <div style="flex: 1; height: 1px; background: #ddd;"></div>
      </div>

      <button class="btn btn-outline btn-md" style="width:100%; margin-bottom:20px; font-weight: 600;"
        onclick="document.getElementById('auth-login-form').classList.add('hidden'); document.getElementById('auth-register-form').classList.remove('hidden')">
        Criar Nova Conta
      </button>
    </div>

    <!-- Formulário de Recuperação de Senha -->
    <div id="auth-recover-form" class="hidden">

      <div class="form-group" style="margin-top: 10px;">
        <label class="form-label" for="recover-email" style="font-weight: 700;">E-mail <span
            style="color: var(--danger);">*</span></label>
        <input type="email" class="form-control" id="recover-email" placeholder="Digite seu e-mail cadastrado"
          required />
      </div>

      <button class="btn btn-secondary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;"
        onclick="Auth.solicitarCodigo()">
        Solicitar Código
      </button>

      <div id="recover-codigo-display"
        style="background:#E0F2FE; color:#0369A1; border-radius:8px; padding:12px; text-align:center; font-size:24px; font-weight:800; letter-spacing:6px; margin-bottom:12px;">
        ······</div>

      <div id="recover-codigo-box" class="hidden" style="margin-top: 10px;">

        <!-- Quadro do código gerado com botão copiar -->
        <div
          style="background:#F0F9FF; border:2px dashed #0284C7; border-radius:10px; padding:14px; text-align:center; margin-bottom:14px;">
          <div style="font-size:13px; color:#0369A1; font-weight:700; margin-bottom:6px;">Seu código de recuperação
          </div>
          <div id="recover-codigo-exibido" style="font-size:30px; font-weight:800; letter-spacing:6px; color:#0284C7;">
            ------</div>
          <button type="button" class="btn btn-outline btn-md" style="width:100%; margin-top:10px; font-weight:600;"
            onclick="Auth.copiarCodigo()">
            📋 Copiar Código
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="recover-codigo" style="font-weight: 700;">Código de 6 dígitos <span
              style="color: var(--danger);">*</span></label>
          <input type="text" class="form-control" id="recover-codigo" placeholder="Ex.: 482913" maxlength="6"
            required />
        </div>

        <div class="form-group">
          <label class="form-label" for="recover-new-pass" style="font-weight: 700;">Nova Senha <span
              style="color: var(--danger);">*</span></label>
          <input type="password" class="form-control" id="recover-new-pass" placeholder="Defina sua nova senha"
            required />
        </div>

        <div class="form-group">
          <label class="form-label" for="recover-confirm-pass" style="font-weight: 700;">Confirmar Nova Senha <span
              style="color: var(--danger);">*</span></label>
          <input type="password" class="form-control" id="recover-confirm-pass" placeholder="Confirme a nova senha"
            required />
        </div>

        <button class="btn btn-primary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;"
          onclick="Auth.redefinirSenha()">
          Redefinir Senha
        </button>

      </div>

      <button class="btn btn-outline btn-md" style="width:100%; font-weight: 600;"
        onclick="document.getElementById('auth-recover-form').classList.add('hidden'); document.getElementById('auth-login-form').classList.remove('hidden')">
        Voltar para o Login
      </button>
    </div>

    <!-- Formulário de Cadastro -->
    <div id="auth-register-form" class="hidden">

      <div class="form-group" style="margin-top: 10px;">
        <label class="form-label" for="register-name" style="font-weight: 700;">Nome Completo <span
            style="color: var(--danger);">*</span></label>
        <input type="text" class="form-control" id="register-name" placeholder="Seu nome completo" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-email" style="font-weight: 700;">E-mail <span
            style="color: var(--danger);">*</span></label>
        <input type="email" class="form-control" id="register-email" placeholder="nome@provedor.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-password" style="font-weight: 700;">Senha <span
            style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="register-password" placeholder="Defina sua senha" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-confirm-password" style="font-weight: 700;">Confirmar Senha <span
            style="color: var(--danger);">*</span></label>
        <input type="password" class="form-control" id="register-confirm-password" placeholder="Confirme sua senha"
          required />
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%; margin-bottom:12px; font-weight: 700;"
        onclick="Auth.register()">
        Criar Conta & Acessar
      </button>

      <button class="btn btn-outline btn-md" style="width:100%; font-weight: 600;"
        onclick="document.getElementById('auth-register-form').classList.add('hidden'); document.getElementById('auth-login-form').classList.remove('hidden')">
        Já tenho conta
      </button>
    </div>

  </div>

</div>
