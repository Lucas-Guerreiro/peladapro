<!-- pages/login.html — Interface de Acesso ao PeladaPro -->
<div class="login-container" id="view-auth">

  <div class="card login-card">

    <!-- Brand -->
    <div class="login-brand">
      <h1>PELADA <span>PRO</span></h1>
    </div>
    <p class="login-subtitle">Gestão de Peladas Amadoras</p>


    <!-- Formulário de Login -->
    <div id="auth-login-form">
      <!-- Botão Google Login no Topo -->
      <button class="btn btn-outline btn-lg" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; border-color: var(--border-color); background: var(--card-background);" onclick="Auth.loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span class="text-inter" style="font-weight: 600; font-size: 14px; color: var(--text-heading);">Entrar com Google</span>
      </button>

      <div class="divider" style="margin-bottom: 20px;">Ou entre com suas credenciais</div>

      <div class="form-group">
        <label class="form-label" id="login-user-label" for="login-user">E-mail</label>
        <input type="text" class="form-control" id="login-user"
          placeholder="Ex.: atleta@gmail.com"
          onkeydown="if(event.key==='Enter') Auth.login()"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pass">Senha</label>
        <input type="password" class="form-control" id="login-pass"
          placeholder="(opcional neste protótipo)"
          onkeydown="if(event.key==='Enter') Auth.login()"
        />
      </div>

      <button class="btn btn-secondary btn-lg" style="width:100%; margin-bottom:12px" onclick="Auth.login()">
        Entrar
      </button>

      <button class="btn btn-outline btn-md" style="width:100%; margin-bottom:20px"
        onclick="document.getElementById('auth-login-form').classList.add('hidden'); document.getElementById('auth-register-form').classList.remove('hidden')">
        Criar Conta
      </button>
    </div>

    <!-- Formulário de Cadastro -->
    <div id="auth-register-form" class="hidden">
      <!-- Botão Google Login no Topo -->
      <button class="btn btn-outline btn-lg" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; border-color: var(--border-color); background: var(--card-background);" onclick="Auth.loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span class="text-inter" style="font-weight: 600; font-size: 14px; color: var(--text-heading);">Entrar com Google</span>
      </button>

      <div class="divider" style="margin-bottom: 20px;">Ou crie com e-mail</div>

      <div class="form-group">
        <label class="form-label" for="register-name">Nome Completo</label>
        <input type="text" class="form-control" id="register-name" placeholder="Seu nome completo" />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-email">E-mail</label>
        <input type="email" class="form-control" id="register-email" placeholder="nome@provedor.com" />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-password">Senha</label>
        <input type="password" class="form-control" id="register-password" placeholder="Defina sua senha" />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-confirm-password">Confirmar Senha</label>
        <input type="password" class="form-control" id="register-confirm-password" placeholder="Confirme sua senha" />
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%; margin-bottom:12px" onclick="Auth.register()">
        Criar Conta & Acessar
      </button>

      <button class="btn btn-outline btn-md" style="width:100%"
        onclick="document.getElementById('auth-register-form').classList.add('hidden'); document.getElementById('auth-login-form').classList.remove('hidden')">
        Já tenho conta
      </button>
    </div>


  </div>

</div>

<!-- Container global de modais -->
<div id="modal-container-root"></div>
