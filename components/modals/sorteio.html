<!-- Modal: Sorteio de Times -->
<div class="modal-backdrop" id="modal-sorteio-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Sorteio de Equipes</h3>
      <button class="modal-close" id="btn-close-sorteio-modal">&times;</button>
    </div>
    <p class="text-inter" style="font-size: 14px; color: var(--text-caption); margin-bottom: 20px;">
      Selecione a modalidade de distribuição dos atletas presentes:
    </p>

    <!-- SELEÇÃO DO FORMATO DE TORNEIO/JOGO DO DIA -->
    <div style="margin-bottom: 20px; background: #EEF2FF; border: 1.5px solid #C7D2FE; border-radius: 12px; padding: 14px;">
      <label for="modal-select-pelada-modo" class="form-label" style="font-size: 13px; font-weight: 800; color: #3730A3; margin-bottom: 6px; display: block;">
        🏆 Formato do Torneio / Modo do Dia
      </label>
      <select id="modal-select-pelada-modo" class="form-control" style="font-weight: 700; font-size: 13px; color: #1E1B4B; background: #FFFFFF; border-radius: 8px; border: 1px solid #A5B4FC; height: 38px;">
        <option value="normal">Pelada Normal (Reina Campo)</option>
        <option value="torneio">Mini Torneio (Misto: Tabela + Mata-Mata)</option>
        <option value="pontos_corridos">Mini Torneio (Pontos Corridos)</option>
        <option value="mata_mata_direto">Mini Torneio (Mata-Mata Direto)</option>
        <option value="torneio_livre">Torneio Livre (Confrontos Manuais)</option>
      </select>
    </div>

    <!-- SELEÇÃO DA QUANTIDADE DE TIMES NO TORNEIO -->
    <div style="margin-bottom: 20px; background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 12px; padding: 14px;">
      <label for="modal-select-qtd-times" class="form-label" style="font-size: 13px; font-weight: 800; color: #0F172A; margin-bottom: 6px; display: block;">
        👥 Quantidade de Equipes no Torneio
      </label>
      <select id="modal-select-qtd-times" class="form-control" style="font-weight: 700; font-size: 13px; color: #0F172A; background: #FFFFFF; border-radius: 8px; border: 1px solid #94A3B8; height: 38px; cursor: pointer;">
        <option value="2">2 Times (Ex: Time A x Time B)</option>
        <option value="3">3 Times (Ex: Time A, B, C)</option>
        <option value="4" selected>4 Times (Ex: Time A, B, C, D)</option>
        <option value="5">5 Times (Ex: Time A, B, C, D, E)</option>
        <option value="6">6 Times (Ex: Time A, B, C, D, E, F)</option>
      </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
      <label style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: var(--transition);">
        <input type="radio" name="sorteio-type" value="todos" checked>
        <div>
          <strong class="text-inter" style="font-size: 16px;">Sorteio A: Todos os Presentes</strong>
          <span style="display: block; font-size: 12px; color: var(--text-caption); margin-top: 2px;">Distribui todos os atletas confirmados presentes nas equipes configuradas.</span>
        </div>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: var(--transition);">
        <input type="radio" name="sorteio-type" value="necessarios">
        <div>
          <strong class="text-inter" style="font-size: 16px;">Sorteio B: Apenas Necessários</strong>
          <span style="display: block; font-size: 12px; color: var(--text-caption); margin-top: 2px;">Monta apenas os times completos baseados no dimensionamento. Excedentes ficam na fila.</span>
        </div>
      </label>
    </div>

    <!-- NOMES DOS TIMES CADASTRADOS PARA USAR NO SORTEIO -->
    <div style="margin-bottom: 20px; background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 12px; padding: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label class="form-label" style="font-size: 13px; font-weight: 800; color: #0F172A; margin: 0;">
          🏷️ Nomes Cadastrados dos Times (opcional)
        </label>
      </div>
      <p style="font-size: 11px; color: #64748B; margin-top: 0; margin-bottom: 12px;">
        Selecione os nomes que deverão ser usados em cada equipe para esta data ou cadastre novos nomes abaixo.
      </p>

      <!-- Lista dinâmica de selects de times -->
      <div id="sorteio-teams-select-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
        <!-- Preenchido dinamicamente no JS -->
      </div>

      <!-- Formulário para cadastrar novo nome na lista -->
      <div style="display: flex; gap: 8px; border-top: 1px dashed #CBD5E1; padding-top: 10px;">
        <input 
          type="text" 
          id="input-new-registered-team-name" 
          class="form-control" 
          style="font-size: 12px; height: 36px; flex: 1;" 
          placeholder="➕ Cadastrar novo nome de time..."
        >
        <button 
          type="button" 
          id="btn-add-registered-team-name" 
          class="btn btn-sm btn-outline" 
          style="font-weight: 700; font-size: 12px; white-space: nowrap; border-color: #0284C7; color: #0284C7; border-width: 1.5px;"
        >
          Adicionar
        </button>
      </div>
    </div>

    <button id="btn-execute-sorteio" class="btn btn-md btn-accent" style="width: 100%;">
      Executar Sorteio Snake Draft
    </button>
  </div>
</div>
