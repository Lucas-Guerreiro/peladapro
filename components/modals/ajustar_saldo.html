<!-- Modal: Ajustar Saldo do Atleta (Gestor) -->
<div class="modal-backdrop" id="modal-ajustar-saldo-backdrop">
  <div class="modal-content" style="max-width: 440px;">
    <div class="modal-header">
      <h3 id="ajustar-saldo-modal-title">💰 Ajustar Saldo de Atleta</h3>
      <button class="modal-close" onclick="window.App.closeModal()">&times;</button>
    </div>

    <input type="hidden" id="ajustar-saldo-player-id">

    <div style="text-align: center; margin-bottom: 20px;">
      <div id="ajustar-saldo-avatar-container" style="margin-bottom: 10px;"></div>
      <h4 id="ajustar-saldo-atleta-nome" style="font-size: 18px; color: var(--text-heading); margin: 0;">Atleta</h4>
      <p style="font-size: 13px; color: var(--text-caption); margin-top: 4px;">
        Saldo Atual: <strong id="ajustar-saldo-atual-text" style="color: var(--primary);">R$ 0,00</strong>
      </p>
    </div>

    <!-- TIPO DE OPERAÇÃO (CRÉDITO OU DÉBITO) -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label class="form-label" style="font-weight: 700;">Tipo de Lançamento</label>
      <div style="display: flex; gap: 8px;">
        <button type="button" id="btn-tipo-credito" class="btn btn-sm" style="flex: 1; padding: 10px; font-weight: 700; background: #D1FAE5; color: #065F46; border: 2px solid #10B981; border-radius: 8px; cursor: pointer;">
          ➕ Crédito (+ R$)
        </button>
        <button type="button" id="btn-tipo-debito" class="btn btn-sm" style="flex: 1; padding: 10px; font-weight: 700; background: #F1F5F9; color: #64748B; border: 2px solid #CBD5E1; border-radius: 8px; cursor: pointer;">
          ➖ Débito (- R$)
        </button>
      </div>
    </div>

    <!-- VALOR -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label for="ajustar-saldo-valor" class="form-label" style="font-weight: 700;">Valor do Ajuste (R$)</label>
      <div style="position: relative;">
        <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: #64748B; font-size: 18px;">R$</span>
        <input type="number" step="0.50" min="0.01" id="ajustar-saldo-valor" class="form-control" placeholder="0.00" style="padding-left: 48px; font-size: 18px; font-weight: 700; color: #0F172A;" value="20.00">
      </div>
    </div>

    <!-- ATALHOS RÁPIDOS DE VALOR -->
    <div style="display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;">
      <button type="button" class="btn-quick-val" data-val="10" style="padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer;">R$ 10</button>
      <button type="button" class="btn-quick-val" data-val="15" style="padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer;">R$ 15</button>
      <button type="button" class="btn-quick-val" data-val="20" style="padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer;">R$ 20</button>
      <button type="button" class="btn-quick-val" data-val="25" style="padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer;">R$ 25</button>
      <button type="button" class="btn-quick-val" data-val="50" style="padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid #CBD5E1; background: #F8FAFC; border-radius: 6px; cursor: pointer;">R$ 50</button>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="form-group" style="margin-bottom: 20px;">
      <label for="ajustar-saldo-descricao" class="form-label" style="font-weight: 700;">Descrição / Motivo no Extrato</label>
      <input type="text" id="ajustar-saldo-descricao" class="form-control" placeholder="Ex: Patrocínio / Apoio aluguel" value="Patrocínio / Apoio aluguel">
    </div>

    <!-- AÇÕES -->
    <div class="modal-footer" style="padding: 0; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
      <button type="button" class="btn btn-secondary" onclick="window.App.closeModal()">Cancelar</button>
      <button type="button" id="btn-confirmar-ajuste-saldo" class="btn btn-primary" style="background: #10B981; border: none; font-weight: 700; padding: 10px 18px;">
        💰 Confirmar Lançamento
      </button>
    </div>
  </div>
</div>
