<!-- Modal: Atualização Obrigatória de E-mail (@teste.com) -->
<div class="modal-backdrop" id="modal-update-email-backdrop" style="display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); z-index: 999999; background: rgba(15, 23, 42, 0.85);">
  <div class="modal-content text-inter" style="max-width: 440px; border-radius: 16px; border: 2px solid #0284C7; padding: 24px;">
    
    <div class="modal-header" style="display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #0284C7; color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">
        ✉️
      </div>
      <div>
        <h3 style="margin: 0; font-size: 17px; font-weight: 800; color: var(--text-heading);">Atualize seu E-mail</h3>
        <p style="margin: 2px 0 0 0; font-size: 12px; color: var(--text-caption);">E-mail temporário detectado</p>
      </div>
    </div>

    <div style="background: #F0F9FF; border-left: 4px solid #0284C7; padding: 12px 14px; border-radius: 8px; margin-bottom: 20px;">
      <p style="font-size: 13px; color: #0369A1; margin: 0; line-height: 1.4; font-weight: 500;">
        Detectamos que sua conta está cadastrada com um e-mail temporário (<b>@teste.com</b>). Por favor, digite seu e-mail verdadeiro para continuar utilizando o aplicativo e receber avisos da pelada.
      </p>
    </div>

    <form id="form-update-email" onsubmit="event.preventDefault(); window.App.submitUpdatedEmail();">
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="input-new-real-email" class="form-label" style="font-weight: 700;">Seu E-mail Verdadeiro *</label>
        <input type="email" id="input-new-real-email" class="form-control" placeholder="exemplo@gmail.com" required style="font-size: 15px; height: 44px;">
      </div>

      <button type="submit" id="btn-submit-update-email" class="btn btn-md btn-primary" style="width: 100%; height: 44px; font-weight: 700; font-size: 14px; cursor: pointer;">
        ✅ Salvar Novo E-mail & Continuar
      </button>
    </form>

  </div>
</div>
