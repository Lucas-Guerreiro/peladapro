<!-- Modal: Registrar Nova Despesa -->
<div class="modal-backdrop" id="modal-despesa-backdrop">
  <div class="modal-content" style="max-width: 480px;">
    <div class="modal-header">
      <h3 style="color: #DC2626; display: flex; align-items: center; gap: 8px; font-size: 18px;">
        <i data-feather="minus-circle" style="width: 20px; height: 20px;"></i> Registrar Nova Despesa
      </h3>
      <button class="modal-close" id="btn-close-expense-modal">&times;</button>
    </div>

    <p style="font-size: 13px; color: var(--text-caption); margin-bottom: 16px;">
      Lance saídas e custos financeiros do grupo vinculados ou não a uma pelada.
    </p>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="expense-value" class="form-label" style="font-weight: 700;">Valor da Despesa (R$) *</label>
      <input type="number" id="expense-value" class="form-control" placeholder="0.00" step="5.00" min="1" required style="font-size: 16px; font-weight: 700;">
    </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label for="expense-category" class="form-label" style="font-weight: 700;">Categoria *</label>
        <select id="expense-category" class="form-control" style="font-size: 13px;">
          <option value="Quadra">Quadra / Campo</option>
          <option value="Arbitragem">Arbitragem</option>
          <option value="Material">Material (Bolas/Coletes)</option>
          <option value="Água">Água / Gelo</option>
          <option value="Churrasco">Churrasco / Confraternização</option>
          <option value="Troféus">Troféus / Medalhas</option>
          <option value="Uniformes">Uniformes / Coletes</option>
          <option value="Mensalidade PWA">Mensalidade App / PWA</option>
          <option value="Fotografia">Fotografia / Mídia</option>
          <option value="Transporte">Transporte / Logística</option>
          <option value="Outros">Outros</option>
          <option value="__nova_categoria__">➕ Outra Categoria (Digitar)...</option>
        </select>

        <!-- Campo para digitar uma nova categoria personalizada -->
        <div id="expense-category-custom-container" style="display: none; margin-top: 8px;">
          <input type="text" id="expense-category-custom-input" class="form-control" placeholder="Digite a nova categoria (ex: Premiação, Segurança...)" style="font-size: 13px; border: 1.5px solid #0284C7;">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label for="expense-pelada-select" class="form-label" style="font-weight: 700;">Vincular à Pelada</label>
        <select id="expense-pelada-select" class="form-control" style="font-size: 13px;">
          <option value="">Nenhuma (Despesa Geral)</option>
          <!-- Preenchido dinamicamente via JS -->
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="expense-status-select" class="form-label" style="font-weight: 700;">Status do Pagamento *</label>
      <select id="expense-status-select" class="form-control" style="font-size: 13px; font-weight: 700; border: 1.5px solid #CBD5E1;">
        <option value="efetivado" selected>✅ Efetivado 100% (Totalmente Pago)</option>
        <option value="parcial">🌗 Parcialmente Efetivado (Pago em Partes)</option>
        <option value="pendente">⏳ Não Efetivado (A Pagar / 0% Pago)</option>
      </select>
    </div>

    <!-- Campo de Valor Parcial (exibido apenas se parcial for selecionado) -->
    <div class="form-group" id="expense-partial-container" style="display: none; margin-bottom: 16px; background: #F0F9FF; border: 1.5px solid #0284C7; border-radius: 8px; padding: 12px;">
      <label for="expense-paid-value" class="form-label" style="font-weight: 800; color: #0284C7;">Valor Já Pago / Efetivado (R$) *</label>
      <input type="number" id="expense-paid-value" class="form-control" placeholder="0.00" step="5.00" min="0" style="font-size: 15px; font-weight: 800; border: 1.5px solid #0284C7; background: #FFFFFF;">
      <span style="font-size: 11px; color: #0284C7; display: block; margin-top: 4px;">Informe quanto do total da despesa já foi pago no caixa.</span>
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label for="expense-description" class="form-label" style="font-weight: 700;">Descrição / Detalhes *</label>
      <input type="text" id="expense-description" class="form-control" placeholder="Ex: Aluguel do campo 2 horas, Compra de 2 bolas Penalty">
    </div>

    <button id="btn-save-expense" class="btn btn-md btn-danger" style="width: 100%; font-weight: 700; height: 44px; cursor: pointer; background: #DC2626; border: none;">
      💸 Confirmar Registro de Despesa
    </button>
  </div>
</div>
