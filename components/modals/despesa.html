<!-- Modal: Registrar Despesa (Financeiro) -->
<div class="modal-backdrop" id="modal-expense-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Registrar Nova Despesa</h3>
      <button class="modal-close" id="btn-close-expense-modal">&times;</button>
    </div>

    <div class="form-group">
      <label for="expense-description" class="form-label">Descrição</label>
      <input type="text" id="expense-description" class="form-control" placeholder="Ex: Aluguel do Campo Society">
    </div>

    <div class="grid-2" style="gap: 16px;">
      <div class="form-group">
        <label for="expense-value" class="form-label">Valor (R$)</label>
        <input type="number" id="expense-value" class="form-control" placeholder="0.00" step="5.00">
      </div>
      <div class="form-group">
        <label for="expense-category" class="form-label">Categoria</label>
        <select id="expense-category" class="form-control">
          <option value="campo">Campo / Quadra</option>
          <option value="churrasco">Churrasco</option>
          <option value="material">Material (Bolas/Coletes)</option>
          <option value="outro">Outro</option>
        </select>
      </div>
    </div>

    <button id="btn-save-expense" class="btn btn-md btn-danger" style="width: 100%;">
      Registrar Despesa
    </button>
  </div>
</div>
