<!-- Modal: Simulação de Google Accounts Sign-In -->
<div class="modal-backdrop" id="modal-google-backdrop" style="display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); z-index: 9999; background: rgba(0,0,0,0.5);">
  <div class="modal-card" style="width: 100%; max-width: 440px; padding: 40px; border-radius: 8px; background: #FFFFFF; color: #202124; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.25s ease-out; font-family: 'Roboto', 'Inter', sans-serif; text-align: left;">
    
    <!-- Logo Google -->
    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
      <svg width="74" height="24" viewBox="0 0 74 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.24 18.06c-5.08 0-9.24-4.07-9.24-9.03 0-4.97 4.16-9.03 9.24-9.03 2.76 0 5.29 1.09 7.21 3.01l-2.5 2.5c-1.28-1.28-2.95-2.01-4.71-2.01-3.69 0-6.68 3-6.68 6.53s2.99 6.53 6.68 6.53c2.3 0 4.13-1.02 5.15-2.62a5.5 5.5 0 0 0-4.9-3.91H9.24V8.5h9.45c.09.49.13.99.13 1.5 0 2.91-1.04 5.37-2.85 7.03a9.05 9.05 0 0 1-6.73 3.03z" fill="#4285F4"/>
        <path d="M26.24 18.06c-4.21 0-7.62-3.41-7.62-7.62s3.41-7.62 7.62-7.62c4.21 0 7.62 3.41 7.62 7.62s-3.41 7.62-7.62 7.62zm0-12.72c-2.81 0-5.09 2.28-5.09 5.1s2.28 5.1 5.09 5.1 5.09-2.28 5.09-5.1-2.28-5.1-5.09-5.1z" fill="#EA4335"/>
        <path d="M43.24 18.06c-4.21 0-7.62-3.41-7.62-7.62s3.41-7.62 7.62-7.62c4.21 0 7.62 3.41 7.62 7.62s-3.41 7.62-7.62 7.62zm0-12.72c-2.81 0-5.09 2.28-5.09 5.1s2.28 5.1 5.09 5.1 5.09-2.28 5.09-5.1-2.28-5.1-5.09-5.1z" fill="#FBBC05"/>
        <path d="M59.74 18.06c-4.09 0-7.12-3.21-7.12-7.53s3.03-7.53 7.12-7.53c2.05 0 3.82.91 4.97 2.45v-2h2.45v13.84c0 3.46-2.5 5.59-5.74 5.59-3.07 0-4.9-2.07-5.59-3.66l2.16-.91c.36.91 1.34 2.05 3.43 2.05 2.14 0 3.29-1.34 3.29-3.27v-1.02a7.35 7.35 0 0 1-4.97 1.99zm.27-12.52c-2.68 0-4.82 2.18-4.82 5.02s2.14 5.02 4.82 5.02c2.68 0 4.82-2.18 4.82-5.02s-2.14-5.02-4.82-5.02z" fill="#4285F4"/>
        <path d="M68.74 18.06V.5h2.52v17.56h-2.52z" fill="#34A85 green"/>
        <path d="M68.74 18.06V.5h2.52v17.56h-2.52z" fill="#34A853"/>
      </svg>
    </div>

    <!-- Título Google -->
    <h1 style="font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 8px; text-align: center;">Fazer login</h1>
    <p style="font-size: 16px; color: #202124; text-align: center; margin-bottom: 28px;">com a sua Conta do Google</p>

    <form id="form-google-signin" onsubmit="event.preventDefault();" style="width: 100%;">
      
      <!-- Input de E-mail -->
      <div style="position: relative; margin-bottom: 28px; width: 100%;">
        <input type="email" id="google-email-input" required placeholder=" " style="
          width: 100%; padding: 16px 14px; font-size: 16px;
          border: 1px solid #dadce0; border-radius: 4px; outline: none;
          color: #202124; transition: border-color 0.15s; background: transparent;
        " />
        <label for="google-email-input" style="
          position: absolute; left: 14px; top: 16px; font-size: 16px;
          color: #5f6368; pointer-events: none; transition: all 0.15s;
          background: #FFFFFF; padding: 0 4px;
        ">E-mail ou telefone</label>
      </div>

      <!-- Links de Termos -->
      <p style="font-size: 12px; color: #5f6368; line-height: 1.6; margin-bottom: 32px;">
        Não é seu computador? Use o modo de navegação anônima para fazer login com privacidade.
        <a href="javascript:void(0);" style="color: #1a73e8; font-weight: 600; text-decoration: none;">Saiba mais</a>
      </p>

      <!-- Botões de Ação do Google -->
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <button type="button" id="btn-google-cancel" style="
          background: transparent; border: none; color: #1a73e8; font-size: 14px;
          font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 4px;
        ">Criar conta</button>

        <button type="button" id="btn-google-next" style="
          background: #1a73e8; border: none; color: #FFFFFF; font-size: 14px;
          font-weight: 600; cursor: pointer; padding: 10px 24px; border-radius: 4px;
          box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        ">Próxima</button>
      </div>
    </form>
  </div>
</div>

<style>
  /* Labels flutuantes simulando Material Design do Google */
  #google-email-input:focus {
    border-color: #1a73e8 !important;
  }
  #google-email-input:focus + label,
  #google-email-input:not(:placeholder-shown) + label {
    top: -8px !important;
    font-size: 12px !important;
    color: #1a73e8 !important;
  }
</style>
