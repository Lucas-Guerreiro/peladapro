<!-- Modal: Ver Escalados do Time -->
<div class="modal-backdrop" id="modal-ver-time-backdrop">
  <div class="modal-content" style="max-width: 420px; padding: 24px;">
    
    <div class="modal-header" style="margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
      <h3 id="ver-time-modal-title" style="margin: 0; font-size: 20px;">👥 Jogadores do Time</h3>
      <button class="modal-close" id="btn-close-ver-time">&times;</button>
    </div>

    <!-- Lista dos Jogadores -->
    <div id="ver-time-list-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; margin-bottom: 20px;">
      <!-- Jogadores inseridos dinamicamente -->
    </div>

    <!-- Ações -->
    <button id="btn-ok-ver-time" class="btn btn-md btn-primary" style="width: 100%; font-weight: bold;">Fechar Visualização</button>

  </div>
</div>
