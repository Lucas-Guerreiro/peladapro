<!-- components/modals/partida_config.html — Modal de Configurações Específicas da Partida -->
<div class="modal-backdrop text-inter" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px;">
  <div class="card modal-card" style="max-width: 520px; padding: 32px; border-radius: 16px; background: #ffffff; color: #0f172a; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15); border: 1px solid rgba(0, 0, 0, 0.08); width: 100%; box-sizing: border-box; animation: scaleUp 0.25s ease-out; max-height: 90vh; overflow-y: auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 class="text-inter" style="font-weight: 800; font-size: 20px; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px;">
        <i data-feather="settings" style="width: 22px; height: 22px; color: #2196f3;"></i>
        Ajustar Regras da Partida
      </h2>
      <button id="btn-close-partida-config" style="border: none; background: transparent; cursor: pointer; font-size: 22px; color: #64748b; line-height: 1;">&times;</button>
    </div>

    <p class="text-inter" style="font-size: 13px; color: #475569; margin: 0 0 20px; line-height: 1.5;">
      Altere as regras e dimensionamento especificamente para esta data. As alterações não afetarão o padrão do grupo.
    </p>

    <input type="hidden" id="partida-config-id" value="">

    <!-- Critério de Empate -->
    <div class="form-group" style="margin-bottom: 20px;">
      <label class="form-label" style="font-weight: 700;">Critério de Empate</label>
      <select id="partida-config-tie" class="form-control">
        <option value="ambos_permanecem">Ambos permanecem em campo</option>
        <option value="vencedor_ultima">Fica o vencedor da partida anterior</option>
        <option value="time_entrando">Fica o time que estava entrando</option>
        <option value="saem_ambos">Saem ambos os times</option>
        <option value="gestor_manual">Gestor decide manualmente</option>
      </select>
    </div>

    <!-- Regra de Saída -->
    <div class="grid-2" style="gap: 16px; margin-bottom: 20px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="partida-config-wins" class="form-label" style="font-weight: 700;">Vitórias para Sair</label>
        <input type="number" id="partida-config-wins" class="form-control" min="2" max="5">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label for="partida-config-exit-rule" class="form-label" style="font-weight: 700;">Destino do Vencedor</label>
        <select id="partida-config-exit-rule" class="form-control">
          <option value="final_fila">Final da fila</option>
          <option value="fora_1_jogo">Fica fora por 1 jogo</option>
        </select>
      </div>
    </div>

    <!-- Dimensionamento -->
    <div class="grid-2" style="gap: 16px; margin-bottom: 20px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="partida-config-players" class="form-label" style="font-weight: 700;">Jogadores por Time</label>
        <input type="number" id="partida-config-players" class="form-control" min="4" max="11">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label for="partida-config-teams" class="form-label" style="font-weight: 700;">Quantidade de Times</label>
        <input type="number" id="partida-config-teams" class="form-control" min="2" max="10">
      </div>
    </div>

    <!-- Finanças (Valor da Convocação) -->
    <div class="form-group" style="margin-bottom: 28px;">
      <label for="partida-config-value" class="form-label" style="font-weight: 700;">Valor da Convocação (R$)</label>
      <input type="number" id="partida-config-value" class="form-control" step="0.50">
    </div>

    <!-- Botões de Ação -->
    <div style="display: flex; gap: 12px;">
      <button id="btn-save-partida-config" class="btn btn-primary btn-md" style="flex: 1; font-weight: 700; height: 44px; cursor: pointer;">
        Salvar Regras da Partida
      </button>
      <button id="btn-cancel-partida-config" class="btn btn-outline btn-md" style="flex: 1; font-weight: 700; height: 44px; cursor: pointer;">
        Cancelar
      </button>
    </div>
    
  </div>
</div>
