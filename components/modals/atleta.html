<!-- Modal: Criar / Editar Atleta (Gestor + Jogador) -->
<div class="modal-backdrop" id="modal-athlete-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="athlete-modal-title">Cadastrar Novo Atleta</h3>
      <button class="modal-close" id="btn-close-athlete-modal" onclick="window.App.closeModal()">&times;</button>
    </div>

    <input type="hidden" id="athlete-edit-id">

    <!-- FOTO DE PERFIL -->
    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; gap: 12px;">
      <div id="athlete-photo-preview" style="
        width: 96px; height: 96px; border-radius: 50%;
        border: 3px solid var(--secondary);
        background: var(--background) url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=150&auto=format&fit=crop&q=80') center/cover no-repeat;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 0 4px rgba(0,230,118,0.15);
        transition: var(--transition);
      " onclick="document.getElementById('athlete-photo-input').click()" title="Clique para trocar a foto">
        <div style="
          position: absolute; inset: 0;
          background: rgba(0,0,0,0.4);
          display: flex; align-items: center; justify-content: center;
          opacity: 0; transition: opacity 0.2s;
          font-size: 22px;
        " id="athlete-photo-overlay">📷</div>
      </div>
      <input type="file" id="athlete-photo-input" accept="image/*" style="display: none;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="text-inter" style="font-size: 12px; color: var(--text-caption);">Clique na foto para alterar</span>
        <button type="button" id="btn-download-modal-photo" class="btn btn-sm btn-outline" style="font-size: 11px; padding: 3px 8px; display: none;" title="Baixar foto em alta resolução">📥 Baixar Foto</button>
      </div>
    </div>

    <!-- NOME E APELIDO -->
    <div class="form-group">
      <label for="athlete-name" class="form-label">Nome Completo</label>
      <input type="text" id="athlete-name" class="form-control" placeholder="Ex: Roberto Carlos">
    </div>

    <div class="form-group">
      <label for="athlete-apelido" class="form-label">Apelido <span style="font-size: 11px; color: var(--text-caption); text-transform: none; font-family: var(--font-body); font-weight: 400;">(exibido no card e times)</span></label>
      <input type="text" id="athlete-apelido" class="form-control" placeholder="Ex: Roberto, Beto, Capitão...">
    </div>

    <div class="form-group">
      <label for="athlete-email" class="form-label">E-mail <span style="font-size: 11px; color: var(--text-caption); text-transform: none; font-family: var(--font-body); font-weight: 400;">(obrigatório para login)</span></label>
      <input type="email" id="athlete-email" class="form-control" placeholder="Ex: jogador@email.com">
    </div>

    <div class="form-group">
      <label for="athlete-password" class="form-label">Senha <span style="font-size: 11px; color: var(--text-caption); text-transform: none; font-family: var(--font-body); font-weight: 400;">(deixe em branco para manter a atual)</span></label>
      <input type="password" id="athlete-password" class="form-control" placeholder="Nova senha (mínimo 6 caracteres)">
    </div>

    <!-- NASCIMENTO -->
    <div class="form-group">
      <label for="athlete-dob" class="form-label">Data de Nascimento</label>
      <input type="date" id="athlete-dob" class="form-control">
    </div>

    <!-- WHATSAPP -->
    <div class="form-group">
      <label for="athlete-whatsapp" class="form-label">WhatsApp</label>
      <input type="text" id="athlete-whatsapp" class="form-control" placeholder="(00) 00000-0000" maxlength="15">
    </div>

    <!-- TIME DO CORAÇÃO -->
    <div class="form-group">
      <label for="athlete-team" class="form-label">Time do Coração ⚽</label>
      <select id="athlete-team" class="form-control">
        <option value="">Selecione seu time...</option>
        <optgroup label="Rio de Janeiro">
          <option value="Botafogo">Botafogo</option>
          <option value="Flamengo">Flamengo</option>
          <option value="Fluminense">Fluminense</option>
          <option value="Vasco da Gama">Vasco da Gama</option>
        </optgroup>
        <optgroup label="São Paulo">
          <option value="Corinthians">Corinthians</option>
          <option value="Palmeiras">Palmeiras</option>
          <option value="Ponte Preta">Ponte Preta</option>
          <option value="Red Bull Bragantino">Red Bull Bragantino</option>
          <option value="Santos">Santos</option>
          <option value="São Paulo">São Paulo</option>
        </optgroup>
        <optgroup label="Minas Gerais">
          <option value="América Mineiro">América Mineiro</option>
          <option value="Atlético Mineiro">Atlético Mineiro</option>
          <option value="Cruzeiro">Cruzeiro</option>
        </optgroup>
        <optgroup label="Outros">
          <option value="Outro / Nenhum">Outro / Nenhum</option>
        </optgroup>
      </select>
    </div>

    <!-- GOLEIRO -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <span class="form-label" style="margin-bottom: 0;">Posição: Goleiro?</span>
      <label class="toggle-switch">
        <input type="checkbox" id="athlete-is-gk" class="toggle-input">
        <span class="toggle-label"></span>
      </label>
    </div>

    <!-- AUTOAVALIAÇÃO (Visível apenas para o Gestor) -->
    <div class="form-group" style="text-align: center;" id="athlete-rating-container">
      <label class="form-label" style="display: block; margin-bottom: 8px;">Autoavaliação Técnica</label>
      <div id="athlete-stars-selector" style="display: flex; gap: 8px; justify-content: center; font-size: 28px;" data-value="0">
        <span class="rating-star" data-value="1" style="cursor: pointer; color: #ccc; transition: color 0.15s;">★</span>
        <span class="rating-star" data-value="2" style="cursor: pointer; color: #ccc; transition: color 0.15s;">★</span>
        <span class="rating-star" data-value="3" style="cursor: pointer; color: #ccc; transition: color 0.15s;">★</span>
        <span class="rating-star" data-value="4" style="cursor: pointer; color: #ccc; transition: color 0.15s;">★</span>
        <span class="rating-star" data-value="5" style="cursor: pointer; color: #ccc; transition: color 0.15s;">★</span>
      </div>
    </div>

    <button id="btn-save-athlete" class="btn btn-md btn-primary" style="width: 100%;" onclick="window.App.handleSaveAthleteProxy(event)">
      Salvar Cadastro
    </button>
  </div>
</div>
