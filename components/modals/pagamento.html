<!-- Modal: Pagamento / Adicionar Presença -->
<div class="modal-backdrop" id="modal-payment-backdrop">
  <div class="modal-content" style="max-width: 400px; padding: 24px; border-radius: 16px; background: #ffffff; box-shadow: var(--shadow-lg);">
    
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
      <h3 id="payment-modal-title" style="margin: 0; font-size: 18px; font-weight: 800; color: var(--text-heading);">Confirmar Convocação</h3>
      <button class="modal-close" id="btn-close-payment-modal" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-caption);">&times;</button>
    </div>
    
    <p class="text-inter" style="font-size: 14px; color: var(--text-body); margin-bottom: 20px; line-height: 1.5;">
      Esta convocação tem o valor de <strong id="payment-match-cost" style="color: var(--primary);">R$ 20,00</strong>.
    </p>

    <!-- Opção Saldo -->
    <div id="payment-option-balance-label" style="display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 2px solid var(--primary); background: rgba(2, 132, 199, 0.04); border-radius: 12px; margin-bottom: 20px; transition: all 0.2s;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="radio" name="payment-method" id="pay-method-balance" value="saldo" checked style="margin: 0; cursor: pointer;">
        <div>
          <strong class="text-inter" style="font-size: 15px; color: var(--primary);">Usar Saldo Interno</strong>
          <span id="payment-my-balance" style="display: block; font-size: 12px; color: var(--text-caption); margin-top: 2px;">Disponível: R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Alerta de Saldo Insuficiente -->
    <div id="payment-insufficient-alert" style="display: none; flex-direction: column; gap: 8px; background: #FFF5F5; border: 1px solid #FEB2B2; border-radius: 12px; padding: 14px; margin-bottom: 20px;">
      <span style="font-weight: 700; font-size: 13px; color: #C53030; display: flex; align-items: center; gap: 6px;">
        ⚠️ Saldo Insuficiente
      </span>
      <p style="font-size: 12px; color: #9B2C2C; margin: 0; line-height: 1.4;">
        Faça a transferência Pix copiando a chave e anexe o comprovante na tela anterior para liberar seu saldo.
      </p>
    </div>

    <button id="btn-confirm-payment-action" class="btn btn-md btn-primary" style="width: 100%; font-weight: 700; height: 42px; border-radius: 10px;">
      Concluir Convocação
    </button>
  </div>
</div>
