<!-- Modal: Pagamento / Adicionar Presença -->
<div class="modal-backdrop" id="modal-payment-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="payment-modal-title">Confirmar Convocação</h3>
      <button class="modal-close" id="btn-close-payment-modal">&times;</button>
    </div>
    <p class="text-inter" style="font-size: 14px; color: var(--text-caption); margin-bottom: 20px;">
      Esta convocação tem o valor de <strong id="payment-match-cost" style="color: var(--primary);">R$ 20,00</strong>. Escolha como deseja pagar:
    </p>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
      <!-- Opção Saldo -->
      <label id="payment-option-balance-label" style="display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: var(--transition);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="radio" name="payment-method" id="pay-method-balance" value="saldo" checked>
          <div>
            <strong class="text-inter" style="font-size: 15px;">Usar Saldo Interno</strong>
            <span id="payment-my-balance" style="display: block; font-size: 12px; color: var(--text-caption);">Disponível: R$ 0,00</span>
          </div>
        </div>
      </label>
      
      <!-- Opção PIX -->
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 2px solid var(--border-color); border-radius: 10px; cursor: not-allowed; opacity: 0.6; transition: var(--transition);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="radio" name="payment-method" id="pay-method-pix" value="pix" disabled>
          <div>
            <strong class="text-inter" style="font-size: 15px; color: var(--text-caption);">Pagar via PIX</strong>
            <span style="display: block; font-size: 12px; color: var(--danger); font-weight: bold;">(Em breve essa funcionalidade estará ativa)</span>
          </div>
        </div>
        <i data-feather="qr-code" style="color: var(--text-caption);"></i>
      </label>
    </div>

    <!-- QR Code Simulado -->
    <div id="pix-qr-area" class="hidden" style="text-align: center; margin-bottom: 20px; background-color: var(--background); padding: 16px; border-radius: 10px;">
      <p style="font-size: 12px; font-weight: bold; margin-bottom: 8px;">QR CODE PIX SIMULADO</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PeladaProPixSimulado" alt="QR Code" style="width: 150px; height: 150px; margin: 0 auto 8px auto; display: block; border-radius: 6px;">
      <p class="text-inter" style="font-size: 11px; color: var(--text-caption);">Código copia e cola: <code>peladapr-pix-mock-uuid-key</code></p>
    </div>

    <button id="btn-confirm-payment-action" class="btn btn-md btn-primary" style="width: 100%;">
      Concluir Convocação
    </button>
  </div>
</div>
