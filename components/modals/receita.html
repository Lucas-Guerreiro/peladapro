<!-- Modal: Injetar Verba / Receita no Caixa -->
<div class="modal-backdrop" id="modal-receita-backdrop">
  <div class="modal-content" style="max-width: 480px;">
    <div class="modal-header">
      <h3 style="color: #047857; display: flex; align-items: center; gap: 8px; font-size: 18px;">
        <i data-feather="plus-circle" style="width: 20px; height: 20px;"></i> Injetar Verba no Caixa
      </h3>
      <button class="modal-close" id="btn-close-income-modal">&times;</button>
    </div>

    <p style="font-size: 13px; color: var(--text-caption); margin-bottom: 16px;">
      Adicione entradas extras ao caixa do grupo (ex: patrocínios, doações ou verba de abertura).
    </p>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="income-value" class="form-label" style="font-weight: 700;">Valor da Entrada (R$) *</label>
      <input type="number" id="income-value" class="form-control" placeholder="0.00" step="5.00" min="1" required style="font-size: 16px; font-weight: 700;">
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="income-description" class="form-label" style="font-weight: 700;">Motivo / Origem da Verba *</label>
      <input type="text" id="income-description" class="form-control" placeholder="Ex: Patrocínio Supermercado, Saldo Anterior">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label for="income-category" class="form-label" style="font-weight: 700;">Categoria</label>
      <select id="income-category" class="form-control">
        <option value="Patrocínio">Patrocínio</option>
        <option value="Aporte do Gestor">Aporte do Gestor</option>
        <option value="Doação">Doação</option>
        <option value="Mensalidade Externa">Mensalidade Externa</option>
        <option value="Outro">Outra Entrada</option>
      </select>
    </div>

    <button id="btn-save-income" class="btn btn-md btn-accent" style="width: 100%; font-weight: 700; height: 44px; cursor: pointer; background: #047857; border: none;">
      ✅ Confirmar Entrada de Verba
    </button>
  </div>
</div>
