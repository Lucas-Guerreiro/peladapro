<!-- Modal: Registrar Receita / Injetar Verba (Financeiro) -->
<div class="modal-backdrop" id="modal-income-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="color: #0369A1; display: flex; align-items: center; gap: 8px; font-size: 18px;">
        💵 Injetar Verba / Receita no Caixa
      </h3>
      <button class="modal-close" id="btn-close-income-modal">&times;</button>
    </div>

    <div class="form-group" style="margin-top: 12px;">
      <label for="income-description" class="form-label" style="font-weight: 700;">Descrição da Entrada</label>
      <input type="text" id="income-description" class="form-control" placeholder="Ex: Patrocínio, Aporte do Gestor, Doação">
    </div>

    <div class="grid-2" style="gap: 16px;">
      <div class="form-group">
        <label for="income-value" class="form-label" style="font-weight: 700;">Valor da Entrada (R$)</label>
        <input type="number" id="income-value" class="form-control" placeholder="0.00" step="5.00">
      </div>
      <div class="form-group">
        <label for="income-category" class="form-label" style="font-weight: 700;">Categoria</label>
        <select id="income-category" class="form-control">
          <option value="aporte">Aporte / Verba do Caixa</option>
          <option value="patrocinio">Patrocínio</option>
          <option value="mensalidade">Mensalidade Externa</option>
          <option value="outro">Outra Entrada</option>
        </select>
      </div>
    </div>

    <button id="btn-save-income" class="btn btn-md btn-accent" style="width: 100%; font-weight: 700; height: 44px; margin-top: 12px; cursor: pointer;">
      ✅ Registrar Entrada no Caixa
    </button>
  </div>
</div>
