<div class="modal-backdrop">
  <div class="modal-sheet" style="max-width: 440px; text-align: center;">
    <div class="modal-header" style="justify-content: center; position: relative;">
      <h3 class="modal-title" style="font-size: 18px; font-weight: 800; color: #1E293B; display: flex; align-items: center; gap: 8px;">
        🎯 Disputa de Pênaltis
      </h3>
      <button class="modal-close-btn" id="btn-close-penaltis" style="position: absolute; right: 16px; top: 16px;">✕</button>
    </div>

    <div class="modal-body" style="padding: 16px 20px;">
      <div style="background: #FEF3C7; border: 1px solid #FCD34D; border-radius: 10px; padding: 12px; margin-bottom: 16px;">
        <span style="font-size: 11px; font-weight: 700; color: #92400E; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px;">Empate no Tempo Normal!</span>
        <div id="penaltis-match-title" style="font-size: 14px; font-weight: 800; color: #78350F;">
          Time A 0 x 0 Time B
        </div>
      </div>

      <p style="font-size: 13px; color: #64748B; margin-bottom: 16px;">
        Informe o resultado da cobrança de pênaltis para definir a equipe classificada:
      </p>

      <div style="display: flex; align-items: center; justify-content: space-around; gap: 12px; margin-bottom: 20px;">
        <!-- Time A -->
        <div style="flex: 1; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 12px; text-align: center;">
          <div id="penaltis-team-a-name" style="font-weight: 700; font-size: 13px; color: #0F172A; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            Time A
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <button id="btn-penaltis-a-minus" type="button" class="btn btn-sm btn-outline-secondary" style="width: 32px; height: 32px; font-weight: 800; font-size: 16px; padding: 0;">-</button>
            <span id="penaltis-score-a-val" style="font-size: 24px; font-weight: 900; color: #0F172A; min-width: 28px;">3</span>
            <button id="btn-penaltis-a-plus" type="button" class="btn btn-sm btn-outline-secondary" style="width: 32px; height: 32px; font-weight: 800; font-size: 16px; padding: 0;">+</button>
          </div>
        </div>

        <span style="font-size: 16px; font-weight: 900; color: #94A3B8;">X</span>

        <!-- Time B -->
        <div style="flex: 1; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 12px; text-align: center;">
          <div id="penaltis-team-b-name" style="font-weight: 700; font-size: 13px; color: #0F172A; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            Time B
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <button id="btn-penaltis-b-minus" type="button" class="btn btn-sm btn-outline-secondary" style="width: 32px; height: 32px; font-weight: 800; font-size: 16px; padding: 0;">-</button>
            <span id="penaltis-score-b-val" style="font-size: 24px; font-weight: 900; color: #0F172A; min-width: 28px;">2</span>
            <button id="btn-penaltis-b-plus" type="button" class="btn btn-sm btn-outline-secondary" style="width: 32px; height: 32px; font-weight: 800; font-size: 16px; padding: 0;">+</button>
          </div>
        </div>
      </div>

      <div id="penaltis-error-msg" style="display: none; color: #EF4444; font-size: 12px; font-weight: 700; margin-bottom: 12px;">
        ⚠️ A disputa de pênaltis não pode terminar empatada!
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="btn-cancel-penaltis" type="button" class="btn btn-secondary" style="flex: 1;">Cancelar</button>
        <button id="btn-confirm-penaltis" type="button" class="btn btn-primary" style="flex: 2; font-weight: 800; background: linear-gradient(135deg, #10B981, #059669); border: none;">
          Confirmar Pênaltis ⚽
        </button>
      </div>
    </div>
  </div>
</div>
