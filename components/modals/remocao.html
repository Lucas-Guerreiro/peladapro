<!-- Modal: Cancelar Presença -->
<div class="modal-backdrop" id="modal-removal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Cancelar Convocação</h3>
      <button class="modal-close" id="btn-close-removal-modal">&times;</button>
    </div>
    <p class="text-inter" style="font-size: 14px; color: var(--text-heading); margin-bottom: 16px;">
      Você está solicitando o cancelamento da sua presença para este jogo.
    </p>

    <!-- Info Reembolso -->
    <div id="removal-reimbursement-info" style="padding: 14px; border-radius: 10px; margin-bottom: 20px;">
      <!-- Dinâmico -->
    </div>

    <div style="display: flex; gap: 12px;">
      <button id="btn-cancel-removal" class="btn btn-md btn-outline" style="flex: 1;">
        Voltar
      </button>
      <button id="btn-confirm-removal-action" class="btn btn-md btn-danger" style="flex: 1;">
        Confirmar Saída
      </button>
    </div>
  </div>
</div>
