<!-- Modal: Editar Transação / Lançamento de Caixa -->
<div class="modal-backdrop" id="modal-editar-transacao-backdrop">
  <div class="modal-content" style="max-width: 480px;">
    <div class="modal-header">
      <h3 style="color: #0284C7; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800;">
        ✏️ Editar Lançamento do Caixa
      </h3>
      <button class="modal-close" onclick="window.App.closeModal()">&times;</button>
    </div>

    <p style="font-size: 13px; color: var(--text-caption); margin-bottom: 16px;">
      Altere o valor, tipo ou descrição deste lançamento de entrada ou saída de caixa.
    </p>

    <!-- Tipo de Lançamento (Entrada vs Saída) -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label class="form-label" style="font-weight: 700;">Tipo de Lançamento *</label>
      <div style="display: flex; gap: 12px;">
        <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #047857; border-radius: 8px; padding: 10px; cursor: pointer; background: #ECFDF5; font-weight: 700; color: #047857;" id="label-edit-credito">
          <input type="radio" name="edit-tx-type" id="radio-edit-credito" value="credito" checked style="margin: 0; cursor: pointer;">
          📥 Entrada (Crédito)
        </label>
        <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #E2E8F0; border-radius: 8px; padding: 10px; cursor: pointer; background: #FFFFFF; font-weight: 700; color: var(--text-body);" id="label-edit-debito">
          <input type="radio" name="edit-tx-type" id="radio-edit-debito" value="debito" style="margin: 0; cursor: pointer;">
          📤 Saída (Despesa)
        </label>
      </div>
    </div>

    <!-- Valor -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label for="edit-tx-value" class="form-label" style="font-weight: 700;">Valor (R$) *</label>
      <input type="number" id="edit-tx-value" class="form-control" placeholder="0.00" step="1.00" min="0.01" required style="font-size: 16px; font-weight: 800;">
    </div>

    <!-- Descrição -->
    <div class="form-group" style="margin-bottom: 24px;">
      <label for="edit-tx-description" class="form-label" style="font-weight: 700;">Descrição / Motivo *</label>
      <input type="text" id="edit-tx-description" class="form-control" placeholder="Ex: Compra de Bolas, Verba Injetada">
    </div>

    <!-- Botões de Ação -->
    <div style="display: flex; gap: 10px;">
      <button id="btn-delete-edit-tx" class="btn btn-outline-danger" style="flex: 1; font-weight: 700; padding: 12px; border-radius: 8px; cursor: pointer; color: #DC2626; border: 1.5px solid #FECACA; background: #FEF2F2;">
        🗑️ Excluir
      </button>
      <button id="btn-save-edit-tx" class="btn btn-primary" style="flex: 2; font-weight: 800; padding: 12px; border-radius: 8px; cursor: pointer; background: #0284C7; color: #FFFFFF; border: none;">
        💾 Salvar Alterações
      </button>
    </div>
  </div>
</div>
