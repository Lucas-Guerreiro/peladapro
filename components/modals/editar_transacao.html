<!-- Modal: Editar / Remanejar Transação de Caixa -->
<div class="modal-backdrop" id="modal-editar-transacao-backdrop">
  <div class="modal-content" style="max-width: 500px;">
    <div class="modal-header">
      <h3 style="color: #0284C7; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800;">
        🔄 Remanejar & Editar Lançamento
      </h3>
      <button class="modal-close" onclick="window.App.closeModal()">&times;</button>
    </div>

    <p style="font-size: 13px; color: var(--text-caption); margin-bottom: 16px;">
      Remaneje valores entre o Caixa Geral e uma Pelada específica, ou altere o tipo e valor deste lançamento.
    </p>

    <!-- Tipo de Lançamento (Entrada vs Saída) -->
    <div class="form-group" style="margin-bottom: 14px;">
      <label class="form-label" style="font-weight: 700;">Tipo de Fluxo *</label>
      <div style="display: flex; gap: 12px;">
        <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #047857; border-radius: 8px; padding: 10px; cursor: pointer; background: #ECFDF5; font-weight: 700; color: #047857;" id="label-edit-credito">
          <input type="radio" name="edit-tx-type" id="radio-edit-credito" value="credito" checked style="margin: 0; cursor: pointer;">
          📥 Entrada (Crédito)
        </label>
        <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #E2E8F0; border-radius: 8px; padding: 10px; cursor: pointer; background: #FFFFFF; font-weight: 700; color: var(--text-body);" id="label-edit-debito">
          <input type="radio" name="edit-tx-type" id="radio-edit-debito" value="debito" style="margin: 0; cursor: pointer;">
          📤 Saída (Despesa)
        </label>
      </div>
    </div>

    <!-- Valor -->
    <div class="form-group" style="margin-bottom: 14px;">
      <label for="edit-tx-value" class="form-label" style="font-weight: 700;">Valor (R$) *</label>
      <input type="number" id="edit-tx-value" class="form-control" placeholder="0.00" step="1.00" min="0.01" required style="font-size: 16px; font-weight: 800;">
    </div>

    <!-- Remanejar para Pelada -->
    <div class="form-group" style="margin-bottom: 14px;">
      <label for="edit-tx-pelada-select" class="form-label" style="font-weight: 700;">🔄 Remanejar para a Pelada de:</label>
      <select id="edit-tx-pelada-select" class="form-control" style="font-size: 13px; font-weight: 600; border: 1.5px solid #0284C7; background: #F0F9FF;">
        <option value="">Nenhuma (Caixa Fixo Geral / Vaquinhas)</option>
        <!-- Preenchido dinamicamente via JS -->
      </select>
    </div>

    <!-- Formato / Categoria do Lançamento -->
    <div class="form-group" style="margin-bottom: 14px;">
      <label for="edit-tx-category-select" class="form-label" style="font-weight: 700;">Categoria / Formato *</label>
      <select id="edit-tx-category-select" class="form-control" style="font-size: 13px; font-weight: 600;">
        <option value="Pix Atleta">⚽ Pix Atleta (Pagamento de Convocação)</option>
        <option value="Verba / Aporte">💵 Verba Injetada / Patrocínio / Aporte</option>
        <option value="Crédito Carteira">💳 Recarga de Saldo do Atleta</option>
        <option value="Despesa">🏟️ Despesa / Pagamento de Campo ou Material</option>
        <option value="Outros">📦 Outra Categoria</option>
      </select>
    </div>

    <!-- Status de Efetivação (Efetivado vs Parcial vs Não Efetivado) -->
    <div class="form-group" style="margin-bottom: 14px;">
      <label for="edit-tx-status-select" class="form-label" style="font-weight: 700;">Status de Efetivação *</label>
      <select id="edit-tx-status-select" class="form-control" style="font-size: 13px; font-weight: 700; border: 1.5px solid #CBD5E1;">
        <option value="efetivado">✅ Efetivado 100% (Totalmente Pago)</option>
        <option value="parcial">🌗 Parcialmente Efetivado (Pago em Partes)</option>
        <option value="pendente">⏳ Não Efetivado (A Pagar / 0% Pago)</option>
      </select>
    </div>

    <!-- Campo de Valor Parcial para Edição -->
    <div class="form-group" id="edit-tx-partial-container" style="display: none; margin-bottom: 14px; background: #F0F9FF; border: 1.5px solid #0284C7; border-radius: 8px; padding: 12px;">
      <label for="edit-tx-paid-value" class="form-label" style="font-weight: 800; color: #0284C7;">Valor Já Pago / Efetivado (R$) *</label>
      <input type="number" id="edit-tx-paid-value" class="form-control" placeholder="0.00" step="5.00" min="0" style="font-size: 15px; font-weight: 800; border: 1.5px solid #0284C7; background: #FFFFFF;">
      <span style="font-size: 11px; color: #0284C7; display: block; margin-top: 4px;">Informe quanto do valor total desta despesa já foi pago no caixa.</span>
    </div>

    <!-- Descrição / Detalhes -->
    <div class="form-group" style="margin-bottom: 24px;">
      <label for="edit-tx-description" class="form-label" style="font-weight: 700;">Descrição do Lançamento *</label>
      <input type="text" id="edit-tx-description" class="form-control" placeholder="Ex: Pagamento Pix Atleta Lucas, Aluguel do Campo">
    </div>

    <!-- Botões de Ação -->
    <div style="display: flex; gap: 10px;">
      <button id="btn-delete-edit-tx" class="btn btn-outline-danger" style="flex: 1; font-weight: 700; padding: 12px; border-radius: 8px; cursor: pointer; color: #DC2626; border: 1.5px solid #FECACA; background: #FEF2F2;">
        🗑️ Excluir
      </button>
      <button id="btn-save-edit-tx" class="btn btn-primary" style="flex: 2; font-weight: 800; padding: 12px; border-radius: 8px; cursor: pointer; background: #0284C7; color: #FFFFFF; border: none;">
        💾 Salvar / Remanejar
      </button>
    </div>
  </div>
</div>
