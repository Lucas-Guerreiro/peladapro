<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PeladaPro — Gerencie sua pelada amadora com sorteio inteligente de times, controle financeiro e convocações." />
  <title>PeladaPro — Gestão de Peladas</title>

  <!-- Redirecionamento instantâneo caso acessado diretamente -->
  <script>
    if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/') {
      // Redireciona diretamente para o aplicativo sem passar por tela de vendas
    }
  </script>

  <!-- Design System -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Fontes (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- PWA Manifest & Mobile Standalone Tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0284C7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PeladaPro" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <link rel="shortcut icon" href="/assets/icons/icon-192.png" />

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>

  <!-- GOOGLE SIGN IN (API client) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="components/modals/google_auth.js"></script>
</head>

<body>

  <!-- Ponto de montagem da SPA -->
  <div id="app"></div>

  <!-- Core JS — ordem de dependência: Utils → Api → Auth → Router -->
  <script src="js/core/utils.js"></script>
  <script src="js/team_emblems.js"></script>
  <script src="js/services/pix_ocr.js"></script>
  <script src="js/pwa_installer.js"></script>
  <script src="js/pwa_push.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Router.init();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

</body>

</html>
