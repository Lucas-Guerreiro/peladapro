<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PeladaPro — Gerencie sua pelada amadora com sorteio inteligente de times, controle financeiro e convocações." />
  <title>PeladaPro — Gestão de Peladas</title>

  <!-- Redirecionamento instantâneo caso acessado diretamente -->
  <script>
    if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/') {
      // Redireciona diretamente para o aplicativo sem passar por tela de vendas
    }
  </script>

  <!-- Design System -->
  <link rel="stylesheet" href="css/main.css?v=20260818" />
  <link rel="stylesheet" href="css/components.css?v=20260818" />
  <link rel="stylesheet" href="css/responsive.css?v=20260818" />
  <link rel="stylesheet" href="style.css?v=20260818" />

  <!-- Fontes (Inter & Digital LED Orbitron/Share Tech Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />

  <!-- PWA Manifest & Mobile Standalone Tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0284C7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PeladaPro" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <!-- Google AdSense Oficial -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2291446471490542"
     crossorigin="anonymous"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>
</head>

<body>

  <!-- Ponto de montagem da SPA -->
  <div id="app"></div>

  <!-- Core JS — ordem de dependência: Utils → Api → Auth → Router -->
  <script src="js/core/utils.js"></script>
  <script src="js/team_emblems.js"></script>
  <script src="js/services/pix_ocr.js"></script>
  <script src="js/services/tournamentEngine.js"></script>
  <script src="js/pwa_installer.js"></script>
  <script src="js/pwa_push.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/adsense.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Router.init();
    });
  </script>

  <script>
    // ===== ATUALIZAÇÃO AUTOMÁTICA DO APP =====
    if ('serviceWorker' in navigator) {
      let refreshing = false;

      // Quando o SW novo assumir o controle, recarrega a página sozinho
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(() => console.log('[PWA] Service Worker registrado'))
        .catch(err => console.warn('[PWA] Erro ao registrar SW:', err));
    }
  </script>

</body>

</html>
