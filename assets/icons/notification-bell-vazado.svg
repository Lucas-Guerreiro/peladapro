<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Ícone de Sino de Notificação Vazado com Pentágono de Futebol -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Topo do Sino (Alça) -->
    <path d="M 230,85 C 230,70 240,60 256,60 C 272,60 282,70 282,85" stroke-width="18"/>
    
    <!-- Corpinho Elegante do Sino -->
    <path d="M 130,340 C 130,220 180,105 256,105 C 332,105 382,220 382,340 C 382,370 410,380 420,390 L 92,390 C 102,380 130,370 130,340 Z" stroke-width="20"/>
    
    <!-- Badalo do Sino -->
    <path d="M 206,390 C 206,425 228,450 256,450 C 284,450 306,425 306,390" stroke-width="18"/>

    <!-- Pentágono de Bola de Futebol Vazado no Centro do Sino -->
    <polygon points="256,210 298,240 282,290 230,290 214,240" stroke-width="14"/>
    <line x1="256" y1="210" x2="256" y2="165" stroke-width="12"/>
    <line x1="298" y1="240" x2="340" y2="248" stroke-width="12"/>
    <line x1="282" y1="290" x2="310" y2="330" stroke-width="12"/>
    <line x1="230" y1="290" x2="202" y2="330" stroke-width="12"/>
    <line x1="214" y1="240" x2="172" y2="248" stroke-width="12"/>
  </g>
</svg>
