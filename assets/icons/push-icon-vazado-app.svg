<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Ícone Vazado Fiel ao Ícone Oficial do PeladaPro -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bola de Futebol (Circulo + Linhas de Painéis Vazadas) -->
    <circle cx="256" cy="256" r="236" stroke-width="16"/>
    
    <!-- Painéis Geométricos Superiores/Laterais da Bola -->
    <polygon points="256,36 306,76 288,136 224,136 206,76" stroke-width="10"/>
    <line x1="206" y1="76" x2="110" y2="100" stroke-width="10"/>
    <line x1="306" y1="76" x2="402" y2="100" stroke-width="10"/>
    <line x1="110" y1="100" x2="60" y2="176" stroke-width="10"/>
    <line x1="402" y1="100" x2="452" y2="176" stroke-width="10"/>

    <line x1="60" y1="176" x2="36" y2="256" stroke-width="10"/>
    <line x1="452" y1="176" x2="476" y2="256" stroke-width="10"/>

    <line x1="36" y1="256" x2="60" y2="336" stroke-width="10"/>
    <line x1="476" y1="256" x2="452" y2="336" stroke-width="10"/>

    <line x1="60" y1="336" x2="110" y2="412" stroke-width="10"/>
    <line x1="452" y1="336" x2="402" y2="412" stroke-width="10"/>

    <polygon points="256,476 306,436 288,376 224,376 206,436" stroke-width="10"/>
    <line x1="206" y1="436" x2="110" y2="412" stroke-width="10"/>
    <line x1="306" y1="436" x2="402" y2="412" stroke-width="10"/>

    <!-- ESCUDO E TROFÉU CENTRAL (Fiel ao App Icon) -->
    <!-- Corpo do Troféu / Taça -->
    <path d="M 170,180 L 170,250 C 170,310 220,340 256,350 C 292,340 342,310 342,250 L 342,180 Z" stroke-width="14" fill="#000000" fill-opacity="0.6"/>

    <!-- Base / Pedestal do Troféu -->
    <path d="M 230,350 L 220,390 L 292,390 L 282,350 Z" stroke-width="12" fill="#FFFFFF"/>
    <rect x="206" y="390" width="100" height="16" rx="4" stroke-width="10" fill="#FFFFFF"/>

    <!-- Asas / Alças do Troféu -->
    <path d="M 170,200 C 120,200 120,270 170,280" stroke-width="12"/>
    <path d="M 342,200 C 392,200 392,270 342,280" stroke-width="12"/>

    <!-- Escudo Sobreposto no Troféu -->
    <path d="M 256,150 L 320,175 C 320,260 280,310 256,330 C 232,310 192,260 192,175 Z" stroke-width="14" fill="#000000"/>

    <!-- Estrela no Topo do Escudo -->
    <path d="M 256,165 L 261,176 L 273,177 L 264,185 L 267,197 L 256,191 L 245,197 L 248,185 L 239,177 L 251,176 Z" fill="#FFFFFF" stroke-width="2"/>

    <!-- Ramos de Louro (Laurel Wreath) -->
    <path d="M 210,240 C 205,220 220,205 230,205 C 220,215 220,230 225,245" stroke-width="8" fill="#FFFFFF"/>
    <path d="M 302,240 C 307,220 292,205 282,205 C 292,215 292,230 287,245" stroke-width="8" fill="#FFFFFF"/>

    <!-- Faixa do Texto PELADAPRO -->
    <rect x="180" y="246" width="152" height="34" rx="6" stroke-width="10" fill="#FFFFFF"/>
    <text x="256" y="270" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle" letter-spacing="1">PELADAPRO</text>
  </g>
</svg>
